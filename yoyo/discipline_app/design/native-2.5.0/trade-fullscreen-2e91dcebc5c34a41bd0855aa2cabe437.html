</button>
</div>

<span class="font-mono-price-lg text-mono-price-lg font-bold text-on-surface">1,000.00</span>

</main>
<script>
    // Lightweight micro-interaction for bottom order sheet
    const orderSheet = document.getElementById('order-sheet');
    const openLongBtn = document.getElementById('open-long-btn');
    const openShortBtn = document.getElementById('open-short-btn');
    const closeSheetBtn = document.getElementById('close-sheet-btn');
    const closeSheetHandle = document.getElementById('close-sheet-handle');

    function openSheet() {
      orderSheet.classList.remove('translate-y-full');
      orderSheet.classList.add('translate-y-0');
    }

    function closeSheet() {
      orderSheet.classList.remove('translate-y-0');
      orderSheet.classList.add('translate-y-full');
    }

    openLongBtn.addEventListener('click', openSheet);
    openShortBtn.addEventListener('click', openSheet);
    closeSheetBtn.addEventListener('click', closeSheet);
    closeSheetHandle.addEventListener('click', closeSheet);
  </script>
</body></html>
