<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed pure solid black background (#000000) -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!--
    SPIKE Official App Icon (Production 75% Scale Release)
    - Background: Pure solid black (#000000), full bleed 1024x1024
    - Glyph: Typographical clean sans-serif single through-stem Dollar glyph ($)
    - Metric: Visible total glyph height exactly 768px (75.0% of 1024px)
    - Margin: Exactly 128px top and 128px bottom safe margins (128 + 768 + 128 = 1024)
    - Optical Center: Perfectly centered horizontally and vertically along (512, 512)
    - Contour: Helvetica Neue / SF Pro Display Medium typographic structure, pure white (#FFFFFF), zero gradients, zero shadows
  -->
  <text x="512" y="513"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="1008"
        font-weight="500"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="central">$</text>
</svg>
