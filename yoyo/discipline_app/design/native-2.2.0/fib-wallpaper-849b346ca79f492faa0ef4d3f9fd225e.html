<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPIKE 纪律 · 1.618 (iOS 26 Liquid Glass)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    --accent: #0A84FF;
    --accent-glow: rgba(10, 132, 255, 0.35);
    --up-green: #169873;
    --down-red: #D7355D;
    --mon-highlow: #528CC1;
    --upper-fib: #C93248;
    --lower-fib: #087F69;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    background: #0B0E14;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    color: #111827;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 402x874 iPhone 17 Pro Frame Container */
  .device-frame {
    width: 402px;
    height: 874px;
    position: relative;
    border-radius: 54px;
    background: #FFFFFF;
    overflow: hidden;
    box-shadow: 
      0 0 0 1px rgba(255, 255, 255, 0.18),
      0 28px 80px -16px rgba(0, 0, 0, 0.65),
      0 0 0 12px #1E232F;
  }

  .tabular {
    font-family: 'JetBrains Mono', -apple-system, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Ultra-Clear Apple Liquid Glass (Bright specular rim, high transparency, NO grey haze) */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 
      0 12px 32px -4px rgba(15, 23, 42, 0.08),
      0 4px 12px -2px rgba(15, 23, 42, 0.04),
      inset 0 1px 1.5px rgba(255, 255, 255, 0.95),
      inset 0 -1px 1px rgba(0, 0, 0, 0.03);
  }

  .liquid-glass-lens {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 
      0 4px 14px -1px rgba(10, 132, 255, 0.22),
      inset 0 1px 1px #FFFFFF,
      0 1px 2px rgba(0, 0, 0, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.95);
  }

  .liquid-glass-primary {
    background: linear-gradient(135deg, rgba(10, 132, 255, 0.92) 0%, rgba(0, 113, 227, 0.96) 100%);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 
      0 8px 24px -2px rgba(10, 132, 255, 0.38),
      inset 0 1px 1.5px rgba(255, 255, 255, 0.7);
  }

  .chip-active {
    background: rgba(10, 132, 255, 0.12);
    color: #0A84FF;
    border: 1px solid rgba(10, 132, 255, 0.28);
    font-weight: 600;
  }

  .toggle-active {
    background: rgba(10, 132, 255, 0.10);
    color: #0A84FF;
    border-color: rgba(10, 132, 255, 0.3);
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 36px;
    background: #000000;
    border-radius: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }

  /* Micro Candlestick SVG Rendering */
  .candle-up {
    fill: var(--up-green);
    stroke: var(--up-green);
  }
  .candle-down {
    fill: var(--down-red);
    stroke: var(--down-red);
  }

  /* Pulsing live dot */
  @keyframes livePulse {
    0% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.6); opacity: 0.3; }
    100% { transform: scale(1); opacity: 0.9; }
  }
  .live-glow::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 999px;
    background: #169873;
    animation: livePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    z-index: -1;
  }
</style>
</head>

      </button>
    </div>

    <!-- Row B: Compact Floating Glass Dock (Period Chips + Toggles + Follow-Latest) -->
    <div class="liquid-glass rounded-[22px] p-1.5 flex items-center justify-between shadow-md">
      <!-- Period Chips: 5m, 15m (Active), 1H, 4H, 12H -->
      <div class="flex items-center gap-0.5">
        <button class="px-2 py-1 rounded-[14px] text-[11.5px] tabular font-medium text-gray-600 hover:text-gray-900">5m</button>
        <button class="px-2.5 py-1 rounded-[14px] text-[11.5px] tabular font-bold chip-active shadow-sm">15m</button>
        <button class="px-2 py-1 rounded-[14px] text-[11.5px] tabular font-medium text-gray-600 hover:text-gray-900">1H</button>
        <button class="px-2 py-1 rounded-[14px] text-[11.5px] tabular font-medium text-gray-600 hover:text-gray-900">4H</button>
        <button class="px-2 py-1 rounded-[14px] text-[11.5px] tabular font-medium text-gray-600 hover:text-gray-900">12H</button>
      </div>

      <!-- Vertical Thin Divider -->
      <div class="w-[1px] h-4 bg-gray-300/80 mx-0.5"></div>

      <!-- Toggles: 内部线 / 六均线 / 云带 -->
      <div class="flex items-center gap-1 text-[11px] font-medium text-gray-600">
        <button class="px-1.5 py-0.5 rounded-lg border border-transparent hover:border-gray-200">内部线</button>
        <button class="px-1.5 py-0.5 rounded-lg border border-gray-200/80 toggle-active font-semibold">六均线</button>
        <button class="px-1.5 py-0.5 rounded-lg border border-gray-200/80 toggle-active font-semibold">云带</button>
      </div>

      <!-- Vertical Thin Divider -->
      <div class="w-[1px] h-4 bg-gray-300/80 mx-0.5"></div>

      <!-- Follow-Latest Icon Button -->
      <button class="w-7 h-7 rounded-full flex items-center justify-center text-[#0A84FF] bg-blue-50/70 border border-blue-200/60 active:rotate-45 transition-transform" title="跟随最新">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>

  </div>

  <!-- ========================================================= -->
  <!-- FLOATING LIQUID GLASS CAPSULE TAB BAR (FIVE ICON-ONLY TABS) -->
  <!-- NO TEXT LABELS AT ALL | Custom 24pt line icons with 2pt rounded strokes -->
  <!-- (1) 合约  (2) 监控  (3) 1.618 [ACTIVE]  (4) 持仓  (5) 统计 -->
  <!-- ========================================================= -->
  <div class="absolute bottom-5 left-5 right-5 z-40">
    <div class="liquid-glass rounded-full h-[58px] px-2.5 flex items-center justify-between shadow-2xl">

      <!-- Tab 1: 合约 (Single candlestick with wick and an order arrow) -->
      <button class="w-12 h-11 rounded-full flex items-center justify-center text-gray-500 hover:text-gray-900 active:scale-90 transition-all cursor-pointer" aria-label="合约">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Central Candlestick Wick & Body -->
          <line x1="8" y1="3" x2="8" y2="7" />
          <rect x="5.5" y="7" width="5" height="9" rx="1.5" />
          <line x1="8" y1="16" x2="8" y2="21" />
          <!-- Order diagonal arrow -->
          <line x1="14" y1="14" x2="20" y2="8" />
          <polyline points="16 8 20 8 20 12" />
        </svg>
      </button>

      <!-- Tab 2: 监控 (Radar sweep / pulse rings) -->
      <button class="w-12 h-11 rounded-full flex items-center justify-center text-gray-500 hover:text-gray-900 active:scale-90 transition-all cursor-pointer" aria-label="监控">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Pulse Concentric Rings -->
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
          <!-- Radar sweep line -->
          <line x1="12" y1="12" x2="18.5" y2="5.5" />
        </svg>
      </button>

      <!-- Tab 3: 1.618 [ACTIVE TAB] (Three horizontal levels with a golden spiral arc inside lighter glass lens) -->
      <button class="w-[52px] h-11 liquid-glass-lens rounded-full flex items-center justify-center text-[#0A84FF] active:scale-95 transition-all cursor-pointer shadow-sm" aria-label="1.618">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Three Horizontal Price Levels -->
          <line x1="3" y1="5.5" x2="21" y2="5.5" />
          <line x1="5" y1="12" x2="21" y2="12" stroke-dasharray="2 2" />
          <line x1="3" y1="18.5" x2="21" y2="18.5" />
          <!-- Golden spiral / Fibonacci expansion harmonic arc -->
          <path d="M 4,18.5 C 10,18.5 13,15 13,12 C 13,9 10.5,7.5 8.5,7.5 C 7,7.5 5.8,8.5 5.8,9.8" />
        </svg>
      </button>

      <!-- Tab 4: 持仓 (Shield with a check) -->
      <button class="w-12 h-11 rounded-full flex items-center justify-center text-gray-500 hover:text-gray-900 active:scale-90 transition-all cursor-pointer" aria-label="持仓">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Protective Discipline Shield -->
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <!-- Inner discipline checkmark -->
          <polyline points="9 12 11 14 15 9.5" />
        </svg>
      </button>

      <!-- Tab 5: 统计 (Rising bar chart with a trend line) -->
      <button class="w-12 h-11 rounded-full flex items-center justify-center text-gray-500 hover:text-gray-900 active:scale-90 transition-all cursor-pointer" aria-label="统计">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- Rising bar chart bars -->
          <rect x="4" y="14" width="3.5" height="7" rx="1" />
          <rect x="10.25" y="10" width="3.5" height="11" rx="1" />
          <rect x="16.5" y="6" width="3.5" height="15" rx="1" />
          <!-- Ascending discipline trend line with terminal dot -->
          <path d="M 4,11 L 11,8 L 19,3" />
          <circle cx="19" cy="3" r="1.2" fill="currentColor" />
        </svg>
      </button>

    </div>
  </div>

  <!-- iOS Home Bar Indicator (Bottom Safe-Area) -->
  <div class="absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-[134px] h-[5px] bg-black/85 rounded-full z-50 pointer-events-none"></div>

</div>

</body>
</html>
