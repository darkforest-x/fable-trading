<!-- Interactive Logic for Drafting Direction, Quota Calculation, and Non-blocking feedback -->
<script>
    let currentDirection = 'LONG';
    let currentRatio = 100;
    const baseAllowance = 200.00; // USDT
    const currentPrice = 68100.00;

    function setDirection(dir) {
      currentDirection = dir;
      const btnLong = document.getElementById('btn-long');
      const btnShort = document.getElementById('btn-short');
      const submitBtn = document.getElementById('btn-submit-action');
      const submitText = document.getElementById('btn-submit-text');
      const quick1rLabel = document.getElementById('label-quick-1r');
      const quick1rBtn = document.getElementById('btn-quick-1r');
      const slInput = document.getElementById('input-sl-price');
      const slPercent = document.getElementById('sl-delta-percent');
      const statusTitle = document.getElementById('status-card-title');

      if (dir === 'LONG') {
        // Long Active Style
        btnLong.className = 'flex items-center justify-center space-x-1.5 h-12 rounded-xl bg-primary-container/10 border-2 border-primary-container text-primary font-headline-sm text-headline-sm font-bold transition-all active:scale-[0.98]';
        btnLong.querySelector('span.material-symbols-outlined').className = 'material-symbols-outlined text-primary text-[20px]';

        // Short Inactive Style
        btnShort.className = 'flex items-center justify-center space-x-1.5 h-12 rounded-xl bg-surface-container text-tertiary border-2 border-transparent font-headline-sm text-headline-sm font-medium transition-all active:scale-[0.98]';
        btnShort.querySelector('span.material-symbols-outlined').className = 'material-symbols-outlined text-tertiary text-[20px]';

        // CTA Button in Emerald
        submitBtn.className = 'w-full h-12 flex items-center justify-center space-x-2 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm font-semibold tracking-wide shadow-md active:scale-[0.98] transition-transform';
        submitText.innerText = '买入开多 (受纪律保护)';
        quick1rLabel.innerText = '多单 1R 锁定';
        quick1rBtn.className = 'col-span-5 sm:col-span-4 h-12 flex flex-col justify-center items-center rounded-xl bg-primary-container/10 border border-primary-container/30 text-primary active:scale-95 transition-transform';

        slInput.value = '67,419.00';
        slPercent.innerText = '-1.00%';
        slPercent.className = 'pr-2.5 text-label-sm font-label-sm text-secondary font-medium select-none tabular-nums';
        statusTitle.innerText = 'BTC · 限价开多 / 已挂出，等待成交';
      } else {
        // Short Active Style (Rose Muted)
        btnShort.className = 'flex items-center justify-center space-x-1.5 h-12 rounded-xl bg-[#FDF0F2] border-2 border-[#e11d48] text-[#e11d48] font-headline-sm text-headline-sm font-bold transition-all active:scale-[0.98]';
        btnShort.querySelector('span.material-symbols-outlined').className = 'material-symbols-outlined text-[#e11d48] text-[20px]';

        // Long Inactive Style
        btnLong.className = 'flex items-center justify-center space-x-1.5 h-12 rounded-xl bg-surface-container text-tertiary border-2 border-transparent font-headline-sm text-headline-sm font-medium transition-all active:scale-[0.98]';
        btnLong.querySelector('span.material-symbols-outlined').className = 'material-symbols-outlined text-tertiary text-[20px]';

        // CTA Button in Rose
        submitBtn.className = 'w-full h-12 flex items-center justify-center space-x-2 rounded-full bg-[#e11d48] text-white font-headline-sm text-headline-sm font-semibold tracking-wide shadow-md active:scale-[0.98] transition-transform';
        submitText.innerText = '卖出开空 (受纪律保护)';
        quick1rLabel.innerText = '空单 1R 锁定';
        quick1rBtn.className = 'col-span-5 sm:col-span-4 h-12 flex flex-col justify-center items-center rounded-xl bg-[#FDF0F2] border border-[#e11d48]/30 text-[#e11d48] active:scale-95 transition-transform';

        slInput.value = '68,781.00';
        slPercent.innerText = '+1.00%';
        slPercent.className = 'pr-2.5 text-label-sm font-label-sm text-secondary font-medium select-none tabular-nums';
        statusTitle.innerText = 'BTC · 限价开空 / 已挂出，等待成交';
      }
    }

    function updateQuota(val) {
      currentRatio = parseInt(val, 10);
      document.getElementById('slider-val-label').innerText = currentRatio + '% ' + (currentRatio === 100 ? '(满额风控)' : '(动态配额)');

      const posSize = (baseAllowance * (currentRatio / 100)).toFixed(2);
      const btcAmount = (posSize / currentPrice).toFixed(4);
      const margin = (posSize / 10).toFixed(2);
      const loss = (posSize * 0.1).toFixed(2);

      document.getElementById('val-pos-size').innerText = posSize + ' USDT';
      document.getElementById('val-margin').innerText = margin + ' USDT';
      document.getElementById('val-loss').innerText = '-' + loss + ' U (' + (currentRatio / 100).toFixed(1) + 'R)';
      document.getElementById('quota-detail-note').innerText = currentRatio + '% = 本规则允许上限 (' + posSize + ' USDT / ' + btcAmount + ' BTC)';

      // Clear chip styles
      [25, 50, 75, 100].forEach(p => {
        const chip = document.getElementById('chip-' + p);
        if (chip) {
          if (p === currentRatio) {
            chip.className = 'h-8 rounded-lg bg-primary-container text-on-primary text-label-sm font-label-sm font-semibold shadow-xs';
          } else {
            chip.className = 'h-8 rounded-lg bg-surface-container text-tertiary text-label-sm font-label-sm font-medium hover:bg-surface-container-high transition-colors';
          }
        }
      });
    }

    function setSliderPercent(pct) {
      const slider = document.getElementById('quota-slider');
      slider.value = pct;
      updateQuota(pct);
    }

    function fillLatestPrice() {
      const input = document.getElementById('input-limit-price');
      input.value = "68,100.00";
      input.focus();
    }

    function simulatePlaceOrder() {
      const btn = document.getElementById('btn-submit-action');
      const originalText = document.getElementById('btn-submit-text').innerText;
      btn.disabled = true;
      btn.style.opacity = '0.7';
      document.getElementById('btn-submit-text').innerText = '纪律审查已核准，指令提交中...';

      setTimeout(() => {
        btn.disabled = false;
        btn.style.opacity = '1';
        document.getElementById('btn-submit-text').innerText = originalText;
        const statusTitle = document.getElementById('status-card-title');
        statusTitle.innerText = 'BTC · 挂单已更新于本地撮合队列 (等待触发)';
      }, 900);
    }
  </script>
</body></html>
