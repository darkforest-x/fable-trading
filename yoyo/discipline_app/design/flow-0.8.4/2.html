<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPIKE 独立纪律交易 v0.8.4+ · 选择合约底抽屉 (自选星标与更新排名版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F4F6F4',
            surface: '#FFFFFF',
            'surface-dim': '#F0F3F0',
            jade: '#087F69',
            'jade-dark': '#055C4C',
            'jade-light': '#E6F4F1',
            'rose-trade': '#E11D48',
            'rose-light': '#FFE4E6',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-black/40 backdrop-blur-xs text-gray-900 font-sans flex items-end justify-center min-h-screen p-0 select-none antialiased">

  <!-- Bottom Sheet Container (390px, iOS Styled) -->
  <div class="w-full max-w-[390px] bg-white rounded-t-[36px] shadow-[0_-16px_40px_rgba(0,0,0,0.18)] border-t border-black/5 overflow-hidden flex flex-col max-h-[90vh] relative pb-6 animate-in slide-in-from-bottom duration-200">

    <!-- Draggable Handle Zone (Dedicated Handle Only) -->
    <div class="w-full pt-3 pb-1 flex justify-center cursor-grab active:cursor-grabbing">
      <div class="w-10 h-1.2 rounded-full bg-gray-300"></div>
    </div>

    <!-- Sheet Header -->
    <div class="px-5 py-2 flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold text-gray-900 tracking-tight">选择合约标的</h2>
        <p class="text-xs text-gray-400">支持全仓风控仲裁 · 独立名义上限</p>
      </div>
      <!-- Accessible 44x44 Close Button -->
      <button class="w-11 h-11 -mr-2 rounded-2xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <!-- Search Input with Text-Sensitive Clear X -->
    <div class="px-5 py-1.5">
      <div class="relative flex items-center">
        <span class="material-symbols-outlined text-gray-400 text-lg absolute left-3.5">search</span>
        <input type="text" value="BTC" class="w-full h-11 pl-10 pr-11 rounded-2xl bg-surface-dim border border-black/5 text-xs font-mono font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-jade/20" />
        <!-- Clear X: Rendered when input has text with 44px hit wrapper -->
        <button class="w-11 h-11 absolute right-0 flex items-center justify-center text-gray-400 hover:text-gray-600 active:scale-90">
          <span class="material-symbols-outlined text-sm bg-gray-300/80 rounded-full p-0.5 text-white">close</span>
        </button>
      </div>
    </div>

    <!-- Requirement (5): Segmented Tabs 全部 / 自选 / 最近 -->
    <div class="px-5 pt-2 pb-1">
      <div class="grid grid-cols-3 gap-1 p-1 bg-surface-dim rounded-2xl">
        <button class="py-1.5 rounded-xl text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors">全部</button>
        <button class="py-1.5 rounded-xl text-xs font-semibold bg-white text-gray-900 shadow-xs flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-xs text-amber-500 fill-1">star</span>
          自选 (3)
        </button>
        <button class="py-1.5 rounded-xl text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors">最近</button>
      </div>
    </div>

    <!-- Ranking Stability Banner & Explicit Update Ranking Button -->
    <div class="px-5 py-2 flex items-center justify-between text-[11px] text-gray-500 font-mono border-b border-black/5">
      <span class="flex items-center gap-1 text-gray-400">
        <span class="material-symbols-outlined text-xs text-jade">lock</span>
        排序已锁定 (防价格抖动漂移)
      </span>
      <button class="h-7 px-2.5 rounded-lg bg-jade-light text-jade font-medium flex items-center gap-1 active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-xs">sync</span>
        更新排名
      </button>
    </div>

    <!-- Coin List (Separate 44px Star Button from Row Select) -->
    <div class="flex-1 overflow-y-auto px-5 divide-y divide-black/5 max-h-[50vh]">
      
      <!-- Coin Item 1: BTC (Starred) -->
      <div class="py-3 flex items-center justify-between group">
        <!-- Separate 44x44 Star Button -->
        <button class="w-11 h-11 -ml-2 rounded-xl flex items-center justify-center text-amber-500 active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-xl fill-1">star</span>
        </button>
        
        <!-- Row Content (Click to Select Coin) -->
        <div class="flex-1 ml-1 cursor-pointer">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm text-gray-900">BTC/USDT</span>
            <span class="text-[10px] font-mono bg-jade-light text-jade px-1.5 rounded font-semibold">主流 100x</span>
          </div>
          <div class="text-[11px] text-gray-400 font-mono">保证金上限 10% · 24h 额 1.82B</div>
        </div>

        <div class="text-right font-mono cursor-pointer">
          <div class="text-xs font-bold text-gray-900 tabular-nums">100.00</div>
          <div class="text-[11px] font-semibold text-jade">+2.40%</div>
        </div>
      </div>

      <!-- Coin Item 2: ETH (Starred) -->
      <div class="py-3 flex items-center justify-between group">
        <!-- Separate 44x44 Star Button -->
        <button class="w-11 h-11 -ml-2 rounded-xl flex items-center justify-center text-amber-500 active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-xl fill-1">star</span>
        </button>
        
        <div class="flex-1 ml-1 cursor-pointer">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm text-gray-900">ETH/USDT</span>
            <span class="text-[10px] font-mono bg-jade-light text-jade px-1.5 rounded font-semibold">主流 100x</span>
          </div>
          <div class="text-[11px] text-gray-400 font-mono">保证金上限 10% · 24h 额 940M</div>
        </div>

        <div class="text-right font-mono cursor-pointer">
          <div class="text-xs font-bold text-gray-900 tabular-nums">3,450.20</div>
          <div class="text-[11px] font-semibold text-jade">+1.80%</div>
        </div>
      </div>

      <!-- Coin Item 3: SOL (Starred) -->
      <div class="py-3 flex items-center justify-between group">
        <!-- Separate 44x44 Star Button -->
        <button class="w-11 h-11 -ml-2 rounded-xl flex items-center justify-center text-amber-500 active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-xl fill-1">star</span>
        </button>
        
        <div class="flex-1 ml-1 cursor-pointer">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm text-gray-900">SOL/USDT</span>
            <span class="text-[10px] font-mono bg-amber-light text-amber-900 px-1.5 rounded font-semibold">山寨 20x</span>
          </div>
          <div class="text-[11px] text-gray-400 font-mono">保证金上限 5% · 24h 额 620M</div>
        </div>

        <div class="text-right font-mono cursor-pointer">
          <div class="text-xs font-bold text-gray-900 tabular-nums">182.40</div>
          <div class="text-[11px] font-semibold text-jade">+5.60%</div>
        </div>
      </div>

    </div>

    <!-- Sheet Bottom Discipline Footnote -->
    <div class="px-5 pt-3 text-center border-t border-black/5">
      <span class="text-[11px] text-gray-400 font-mono flex items-center justify-center gap-1">
        <span class="material-symbols-outlined text-xs text-jade">verified</span>
        全标的共享纪律归一化名义总预算池 (10x/5x)
      </span>
    </div>

  </div>

</body>
</html>
