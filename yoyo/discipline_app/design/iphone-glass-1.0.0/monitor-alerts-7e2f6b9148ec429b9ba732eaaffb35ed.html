<style>
  /* iOS 26 Liquid Glass & Refractive Environment */
  :root {
    --app-bg: #EEF2F7;
    --accent: #0A84FF;
  }

  body {
    background-color: #0b0f17;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Fixed 402x874 frame (iPhone 17 Pro ratio spec) */
  .device-frame {
    width: 402px;
    height: 874px;
    background: #EEF2F7;
    position: relative;
    overflow: hidden;
    border-radius: 54px;
    box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.45), 0 0 0 10px #1E232E, 0 0 0 11px #3A4252;
  }

  /* Tabular numbers lock */
  .t-num {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* Liquid Glass Specular and Translucency */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      0 12px 32px -4px rgba(15, 23, 42, 0.07),
      0 2px 6px 0 rgba(15, 23, 42, 0.03),
      inset 0 1px 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 1px 0 rgba(255, 255, 255, 0.3);
    border-radius: 26px;
    position: relative;
  }

  .liquid-glass::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.02) 65%);
    pointer-events: none;
  }

  /* Warm Red Pulsing Hero Glass */
  .liquid-glass-hero {
    background: linear-gradient(145deg, rgba(255, 240, 241, 0.72) 0%, rgba(255, 255, 255, 0.62) 100%);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 175, 178, 0.85);
    box-shadow:
      0 16px 36px -6px rgba(229, 56, 59, 0.12),
      0 4px 12px 0 rgba(15, 23, 42, 0.04),
      inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.98),
      inset 0 -1px 1px 0 rgba(255, 69, 58, 0.15);
    border-radius: 26px;
    position: relative;
  }

  .liquid-glass-hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 48%;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.05) 70%);
    pointer-events: none;
  }

  /* Coin chip translucent glass */
  .glass-chip {
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* Bottom Tab Bar Lens Pill */
  .tab-lens-active {
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 4px 16px rgba(10, 132, 255, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05), inset 0 1px 1px #fff;
    border: 0.5px solid rgba(255, 255, 255, 1);
  }

  /* Smooth pulse animation */
  @keyframes alert-pulse {
    0% { transform: scale(0.95); opacity: 0.85; box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.6); }
    70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 7px rgba(255, 69, 58, 0); }
    100% { transform: scale(0.95); opacity: 0.85; box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }
  }

  .pulse-dot {
    animation: alert-pulse 2s infinite ease-in-out;
  }

  /* Custom scrollbar clean */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>

        <svg class="w-[21px] h-[21px] stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="text-[10px] font-bold tracking-tight mt-0.5">监控</span>
      </button>

      <!-- Tab 5: 统计 -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-slate-500 hover:text-slate-800 transition-colors">
        <svg class="w-[21px] h-[21px] stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px] font-medium tracking-tight mt-0.5">统计</span>
      </button>

    </div>
  </div>

  <!-- iOS Home Indicator Safe Area (12pt gap beneath tab bar) -->
  <div class="absolute bottom-2 inset-x-0 flex justify-center pointer-events-none z-50">
    <div class="w-36 h-1 bg-slate-900/35 rounded-full"></div>
  </div>

</div>
