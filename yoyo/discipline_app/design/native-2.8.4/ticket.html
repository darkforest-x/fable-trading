<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SPIKE 纪律 · CT 快捷开单 (iOS 26 Liquid Glass 402x874pt)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: '#0A84FF',
          tradeGreen: '#169873',
          tradeRed: '#D7355D',
          canvasBg: '#F5F7FB',
          textMain: '#111827',
          textSub: '#6B7280',
          pillBg: '#EEF2F8',
        },
        boxShadow: {
          glass: '0 6px 20px rgba(15, 23, 42, 0.08)',
          card: '0 10px 30px rgba(15, 23, 42, 0.07)',
          modal: '0 -10px 40px rgba(15, 23, 42, 0.12)',
        }
      }
    }

</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #0b0f17;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .tabular-nums {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "JetBrains Mono", sans-serif;
  }

  /* Frosted Glass - 70% white over 24px blur, zero dark border, hairline white inner highlight */
  .frosted-glass {
    background: rgba(255, 255, 255, 0.70);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08), inset 0 1px 0.5px rgba(255, 255, 255, 0.95);
  }

  .frosted-card {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.98);
  }

  .frosted-tabbar {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    box-shadow: 0 8px 32px rgba(15, 23, 42, 0.10), inset 0 1px 1px rgba(255, 255, 255, 0.95);
  }

  .soft-pill {
    background: #EEF2F8;
    color: #111827;
    transition: all 0.15s ease;
  }

  .accent-chip-selected {
    background: rgba(10, 132, 255, 0.12);
    color: #0A84FF;
  }

  .accent-pill-selected {
    background: rgba(10, 132, 255, 0.12);
    color: #0A84FF;
  }

  .recessed-input {
    background: #F0F3F9;
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.05);
  }

  .amber-notice {
    background: rgba(255, 159, 10, 0.12);
    color: #B45309;
  }

  /* Custom slider track */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #E2E8F0;
    border-radius: 9999px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(10, 132, 255, 0.35), 0 1px 3px rgba(15, 23, 42, 0.15);
    border: 3px solid #0A84FF;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.15);
  }
</style>
</head>
<body class="p-0 sm:p-4">

<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">

</div>

<span class="font-medium text-textMain">SUI / USDT 15m</span>
<span class="tabular-nums font-semibold text-[#169873]">0.14326 +2.48%</span>

<!-- Simple decorative candlestick silhouettes -->

<div class="w-1.5 h-20 bg-[#169873]/60 rounded-full"></div>

</div>
<!-- Section: 初始止损 + 2 chips (1R 自动计算 selected vs 手动) -->
