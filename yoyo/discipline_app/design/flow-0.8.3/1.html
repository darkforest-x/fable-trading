<style>

  to { transform: rotate(360deg); }
}
.animate-spin-fast {

}

  transition: all 180ms ease-out;
}

<body class="bg-[#F6F7F5] text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile 390px Canvas Wrapper -->
<main class="w-full max-w-[390px] min-h-screen flex flex-col relative pb-28 px-4 pt-3 select-none">
<!-- 1. 顶部极简沉浸栏 (无多余标题栏，左标的+价格，右独立44px设置) -->
<header class="w-full mb-3 flex flex-col justify-between">
<div class="flex items-center justify-between w-full h-11">
<div class="flex items-center space-x-2">
<div class="w-7 h-7 rounded-full bg-[#F7931A] text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">₿</div>
<button class="flex items-center space-x-1 py-1 px-2.5 rounded-full bg-surface-container-lowest jade-pill-shadow active:scale-95 transition-transform">
<span class="font-label-lg font-bold text-on-surface tracking-tight">BTC/USDT</span>
<span class="font-label-sm text-tertiary px-1 py-0.5 rounded bg-surface-container text-[10px] leading-tight">永续</span>
<span class="material-symbols-outlined text-[16px] text-tertiary">arrow_drop_down</span>
</button>
</div>
<button aria-label="设置" class="w-11 h-11 shrink-0 flex items-center justify-center rounded-full bg-surface-container-lowest jade-pill-shadow text-on-surface hover:text-primary active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</div>
<div class="flex items-baseline space-x-2 pt-1 px-0.5">
<span class="text-[28px] font-bold text-on-surface tracking-tight leading-none">68,420.50</span>
<span class="font-label-md text-primary font-semibold tracking-tight">+2.40%</span>
<span class="relative flex h-2 w-2 shrink-0 self-center ml-0.5" title="行情连接正常">
<span class="relative inline-flex rounded-full h-2 w-2 bg-[#087f69]"></span>
</span>
</div>
</header>
<!-- 2. 纪律三格额度条 (浅绿润玉白瓷圆角卡片) -->
<!-- 2. 极简压薄一体化纪律配额横栏 (整条可点击跳转至纪律页，高度严控约 58px) -->
<a class="block w-full mb-3.5 rounded-2xl bg-[#F4F7F5] border border-[#E3EBE6] p-2 hover:bg-[#EEF4F0] active:scale-[0.99] transition-all jade-pill-shadow" href="#discipline">
<div class="grid grid-cols-3 divide-x divide-[#E0E7E2] py-0.5">
<!-- 第一列: 今日可开 -->
<div class="flex flex-col items-center justify-center px-1 text-center">
<span class="text-[11px] text-[#718079] leading-none mb-1">今日可开</span>
<span class="text-[15px] font-bold text-[#143E35] leading-tight">2 <span class="text-[11px] font-normal text-[#718079]">次</span></span>
</div>
<!-- 第二列: 再亏停手 -->
<div class="flex flex-col items-center justify-center px-1 text-center">
<span class="text-[11px] text-[#718079] leading-none mb-1">再亏停手</span>
<span class="text-[15px] font-bold text-[#087f69] leading-tight">2 <span class="text-[11px] font-normal text-[#718079]">笔</span></span>
</div>
<!-- 第三列: 日亏剩余 -->
<div class="flex flex-col items-center justify-center px-1 text-center">
<span class="text-[11px] text-[#718079] leading-none mb-1">日亏剩余</span>
<span class="text-[15px] font-bold text-[#143E35] leading-tight tracking-tight">150 <span class="text-[11px] font-normal text-[#718079]">U</span></span>
</div>
</div>
</a>
<!-- 3. 下单核心卡片 -->
<section class="bg-surface-container-lowest rounded-3xl p-4 jade-pill-shadow space-y-4"><!-- 1. 买入开多 / 卖出开空 方向切换与杠杆设置 -->
<div class="flex items-center justify-between gap-3">
<div class="bg-surface-container p-1 rounded-full flex items-center flex-1 h-11">
<button class="flex-1 h-full py-1 text-center rounded-full bg-primary text-white font-label-md font-semibold shadow-sm transition-all flex items-center justify-center space-x-1">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span>买入开多</span>
</button>
<button class="flex-1 h-full py-1 text-center rounded-full text-tertiary font-label-md font-semibold hover:text-on-surface transition-all flex items-center justify-center space-x-1">
<span>卖出开空</span>
</button>
</div>
<button class="h-11 shrink-0 flex items-center space-x-1.5 bg-surface-container-low px-3.5 py-1.5 rounded-full border border-outline-variant/30 text-on-surface hover:border-primary active:scale-95 transition-all" title="点击调整杠杆与逐全仓模式">
<span class="font-label-md font-semibold text-on-surface">杠杆 10x 逐仓</span>
<span class="material-symbols-outlined text-[16px] text-tertiary">tune</span>
</button>
</div>
<!-- 市价 / 限价 模式切换 -->
<div class="flex items-center justify-between pt-0.5">
<div class="bg-surface-container-low p-1 rounded-full flex items-center w-36 border border-surface-container">
<button class="flex-1 py-1 text-center rounded-full bg-surface-container-lowest text-on-surface font-label-md font-semibold shadow-sm transition-all">市价</button>
<button class="flex-1 py-1 text-center rounded-full text-tertiary font-label-md transition-all hover:text-on-surface">限价</button>
</div>
<div class="flex items-center space-x-1 text-[11px] text-tertiary">
<span class="material-symbols-outlined text-[15px] text-primary">verified_user</span>
<span>纪律硬约束开启</span>
</div>
</div>
<!-- 2. 初始止损 (Stop Loss)* 及 1R 计算按钮动态计算状态 -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-1.5">
<label class="font-label-md text-on-surface font-semibold flex items-center space-x-1">
<span>初始止损 (Stop Loss)</span>
<span class="text-secondary font-bold">*</span>
</label>
<span class="px-1.5 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant text-[10px] font-semibold leading-tight">必须设置</span>
</div>
<!-- 1R 动态交互计算态按钮 (active pressed / calculating state) -->
<button class="calculate-active-state flex items-center space-x-1 py-1 px-2.5 rounded-full border border-primary text-primary text-[11px] font-semibold">
<span class="material-symbols-outlined text-[13px] animate-spin-fast">progress_activity</span>
<span>多单 1R 止损</span>
</button>
</div>
<!-- 止损输入框 (应用玉绿高亮环与已填入1R保护徽标) -->
<div class="stop-loss-highlight flex-1 flex items-center justify-between bg-surface-container-lowest rounded-2xl px-3.5 h-[50px] border border-primary transition-all">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[18px] text-[#087f69]">shield</span>
<span class="font-body-md font-bold text-on-surface text-[16px]">67,500.00</span>
<span class="font-label-sm text-[10px] text-tertiary font-medium">USDT</span>
<!-- 1R 自动填入玉色徽标 -->
<div class="inline-flex items-center space-x-0.5 bg-[#E8F5F1] text-[#087f69] px-1.5 py-0.5 rounded-full text-[10px] font-medium leading-none">
<span class="material-symbols-outlined text-[11px]" style="font-variation-settings: 'wght' 600;">check</span>
<span>已填入 1R 保护</span>
</div>
</div>
<span class="font-label-sm text-secondary font-semibold bg-[#FDF0F2] px-2 py-0.5 rounded-md text-[11px]">-1.35%</span>
</div>
</div>
<!-- 3. 仓位额度滑动条 (100% 保证金占净值 10%) -->
<div class="space-y-2 pt-1">
<div class="flex items-center justify-between">
<span class="font-label-md text-on-surface font-medium">仓位额度</span>
<div class="text-right flex items-baseline space-x-1.5">
<span class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary tracking-tight">100%</span>
<span class="font-body-sm text-tertiary font-normal">(保证金占净值 10%)</span>
</div>
</div>
<div class="relative pt-1">
<input class="w-full appearance-none bg-transparent" max="100" min="0" step="5" type="range" value="100"/>
<div class="flex justify-between items-center text-[11px] text-tertiary pt-1 px-0.5">
<span>可开额度利用率</span>
<span class="text-primary font-medium">已达最大合规限额</span>
</div>
</div>
</div>
<!-- 4. 三列即时估算卡：本次持仓金额 | 预计保证金 | 预计止损 -->
<div class="grid grid-cols-3 gap-2 bg-[#F6F7F5] p-3 rounded-2xl border border-surface-container">
<div>
<span class="font-label-sm text-tertiary block mb-1">本次持仓金额</span>
<span class="font-label-md font-semibold text-on-surface block">200.00 <span class="font-normal text-[10px] text-tertiary">U</span></span>
</div>
<div class="border-x border-surface-container-highest px-1 text-center">
<span class="font-label-sm text-tertiary block mb-1">预计保证金</span>
<span class="font-label-md font-semibold text-on-surface block">20.00 <span class="font-normal text-[10px] text-tertiary">U</span></span>
<span class="text-[9px] text-primary block leading-none mt-0.5">10x逐仓</span>
</div>
<div class="text-right">
<span class="font-label-sm text-tertiary block mb-1">预计止损</span>
<span class="font-label-md font-semibold text-secondary block">10.00 <span class="font-normal text-[10px] text-secondary">U</span></span>
<span class="text-[9px] text-outline block leading-none mt-0.5">含成本</span>
</div>
</div>
<!-- 5. 主操作按钮 CTA：加粗翡翠玉绿 买入开多 (受纪律保护) -->
<div class="pt-1">
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-headline-sm-mobile text-headline-sm-mobile font-bold flex items-center justify-center space-x-2 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span>买入开多 (受纪律保护)</span>
</button>
</div></section>
<!-- 底部滑动切换提示 -->
<!-- 4. 底部主导航栏 (严格 4 项：合约、纪律、持仓、统计，当前在“合约”) -->
<!-- 居中操作反馈弹窗 (Centered Action Modal) --><nav class="fixed bottom-5 inset-x-4 z-50 flex justify-around items-center h-16 max-w-sm mx-auto px-2 rounded-full bg-surface-container-lowest/90 backdrop-blur-xl dock-shadow">
<!-- 1: 合约 (当前高亮项) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary rounded-full px-4 py-2 transition-all duration-200" href="#trade">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">candlestick_chart</span>
<span class="font-label-sm text-label-sm mt-0.5">合约</span>
</a>
<!-- 2: 纪律 -->
<a class="flex flex-col items-center justify-center text-tertiary hover:text-on-surface px-3 py-2 transition-colors duration-200" href="#discipline">
<span class="material-symbols-outlined text-[20px]">shield_lock</span>
<span class="font-label-sm text-label-sm mt-0.5">纪律</span>
</a>
<!-- 3: 持仓 -->
<a class="flex flex-col items-center justify-center text-tertiary hover:text-on-surface px-3 py-2 transition-colors duration-200" href="#positions">
<span class="material-symbols-outlined text-[20px]">pie_chart</span>
<span class="font-label-sm text-label-sm mt-0.5">持仓</span>
</a>
<!-- 4: 统计 -->
<a class="flex flex-col items-center justify-center text-tertiary hover:text-on-surface px-3 py-2 transition-colors duration-200" href="#analytics">
<span class="material-symbols-outlined text-[20px]">analytics</span>
<span class="font-label-sm text-label-sm mt-0.5">统计</span>
</a>
</nav>
</main>
