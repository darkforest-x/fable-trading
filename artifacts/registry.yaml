# Artifact registry -- one row per dataset, model, weight file, manifest or report
# that any report in this repository cites.
#
# The registry holds identity and a pointer, never the bytes. Task book section
# 3.6 and CLAUDE.md both forbid growing git with weights and image packs; a row
# here with an sha256 and a storage_uri is what "we have this artifact" means.
#
# Validated by yoyo.contracts.artifacts.ArtifactRecord. Rules worth knowing
# before adding a row:
#   - training_eligible and production_eligible are separate, and both default
#     to false. Owner approving a class protocol is not owner approving every
#     sample; a model that trained is not a model that may trade.
#   - production_eligible requires an sha256 and a holdout_status that is not
#     "unknown".
#   - holdout_status "historical" means the artifact predates the holdout rule
#     and its status was inherited, not re-derived. It is not a synonym for
#     "pre_holdout" and does not clear anything for production.
schema_version: 1

