name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # opencv-python links against libGL, which the runner image does not
      # guarantee. Without it the import fails and 37 modules die at collection.
      - name: Install system libraries opencv needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      # Installed from requirements.txt, NOT from a list written out here.
      # The inline list this replaced had drifted: it was missing opencv-python,
      # torch, ultralytics and Pillow, so every test touching the renderer died
      # at collection and the job had never once been green. One semantic, one
      # place -- the same rule the holdout boundary and the cost table follow.
      # pytest is added separately because it is the runner, not a project
      # dependency, and does not belong in requirements.txt.
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests yoyo tools

      - name: Run pytest
        run: python -m pytest tests -q
