<!DOCTYPE html>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0071E3',
              dark: '#1D1D1F',
              cyan: '#00E5FF',

            trade: {
              up: '#169873',

          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'sans-serif'],

  <style>
    /* 严格移动视口容器 */
    body {
      margin: 0;
      padding: 0;
      background: #eef2f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #mobile-frame {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      background: #f7f9fc;
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.25), 0 0 0 10px #1e2430;
    }

    /* Apple Glass Tokens */
    .apple-glass-card {
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.08), 0 2px 8px -2px rgba(0, 0, 0, 0.04);
    }

    .apple-glass-menu {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* 原生 details/summary 纯净无标记 */
    details#spike-menu summary {
      list-style: none;
      outline: none;
    }
    details#spike-menu summary::-webkit-details-marker {
      display: none;
    }

    /* 遮罩层平滑出现 */
    .backdrop-scrim {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.20);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    details[open] ~ .backdrop-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    /* 数字防抖 */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

  <!-- 原生轻量交互脚本: 保证 iOS Safari 路由跳转与关闭契约 -->
  <script>
    const menuDetails = document.getElementById('spike-menu');
    const menuScrim = document.getElementById('menu-scrim');

    // 1. 关闭菜单函数
    function closeMenu() {
      if (menuDetails && menuDetails.hasAttribute('open')) {
        menuDetails.removeAttribute('open');
      }
    }

    // 2. 键盘 ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Esc') {
        closeMenu();
      }
    });

    // 3. 点击外部区域 (Outside Tap) 关闭
    document.addEventListener('click', (e) => {
      if (!menuDetails) return;
      if (menuDetails.hasAttribute('open')) {
        const isClickInside = menuDetails.contains(e.target);
        if (!isClickInside) {
          closeMenu();
        }
      }
    });

    // 4. 关键导航契约: 确保所选链接在菜单关闭前完成跳转 (尤其是 iOS Safari)
    function handleNavClick(event, element, targetHash) {
      // 阻止默认同步闪退，保证哈希变更与事件触发先行
      // 在移动端原生场景中，显式设定 location.hash 确保微任务完成
      window.location.hash = targetHash;
      
      // 更新视觉选中高亮
      document.querySelectorAll('.nav-destination-link').forEach(link => {
        link.classList.remove('bg-blue-50/80', 'text-brand-blue', 'font-semibold');
        link.classList.add('text-slate-700', 'font-medium');
        const checkIcon = link.querySelector('.material-symbols-outlined:last-child');
        if (checkIcon && checkIcon.textContent.trim() === 'check') {
          checkIcon.remove();
        }
      });
      element.classList.remove('text-slate-700', 'font-medium');
      element.classList.add('bg-blue-50/80', 'text-brand-blue', 'font-semibold');

      // 稍作微任务微延迟后收起菜单，确保 Safari 历史栈与路由监听已捕获
      setTimeout(() => {
        closeMenu();
      }, 80);
    }

    // 5. 监听 hashchange 确保成功路由后菜单关闭
    window.addEventListener('hashchange', () => {
      closeMenu();
    });
  </script>
</body>
</html>
