<script data-purpose="theme-management">
    // Light / Dark Theme toggle logic with persistence
    const themeBtn = document.getElementById('themeToggleBtn');
    const htmlEl = document.documentElement;

    function applyTheme(isDark) {
      if (isDark) {
        htmlEl.classList.add('dark');
        htmlEl.classList.remove('light');
      } else {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
      }
      // Notify canvas renderer to redraw with appropriate contrast colors
      if (window.renderStaticChart) {
        window.renderStaticChart();
      }
    }

    themeBtn.addEventListener('click', () => {
      const willBeDark = !htmlEl.classList.contains('dark');
      applyTheme(willBeDark);
    });
  </script>
<script data-purpose="dock-interactions">
    // Segmented timeframe buttons
    const tfButtons = document.querySelectorAll('.tf-btn');
    tfButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tfButtons.forEach(b => {
          b.classList.remove('active-tf', 'bg-accent-blue/15', 'text-accent-blue', 'font-bold', 'shadow-xs');
          b.classList.add('text-slate-500', 'dark:text-slate-400', 'font-medium');
        });
        btn.classList.add('active-tf', 'bg-accent-blue/15', 'text-accent-blue', 'font-bold', 'shadow-xs');
        btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'font-medium');
      });
    });

    // Mode Toggle [区间 | 信号]
    const modeRange = document.getElementById('modeBtnRange');
    const modeSignal = document.getElementById('modeBtnSignal');
    function selectMode(isSignal) {
      if (isSignal) {
        modeSignal.className = "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-slate-700/90 text-slate-900 dark:text-white shadow-sm pressable flex items-center gap-1 transition-all";
        modeRange.className = "px-2.5 py-1.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 pressable transition-all";
      } else {
        modeRange.className = "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-slate-700/90 text-slate-900 dark:text-white shadow-sm pressable transition-all";
        modeSignal.className = "px-2.5 py-1.5 text-xs font-semibold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 pressable flex items-center gap-1 transition-all";
      }
    }
    modeRange.addEventListener('click', () => selectMode(false));
    modeSignal.addEventListener('click', () => selectMode(true));

    // Indicator Toggles (EMA Cloud & 1.618 Lines)
    let showEmaCloud = true;
    let showFibLevels = true;
    const toggleEmaBtn = document.getElementById('toggleEma');
    const toggleFibBtn = document.getElementById('toggleFib');

    function updateToggleStyles() {
      if (showEmaCloud) {
        toggleEmaBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 pressable bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/25";
      } else {
        toggleEmaBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 pressable opacity-50 bg-slate-200/40 dark:bg-slate-800/40 text-slate-500 dark:text-slate-400 border border-transparent";
      }

      if (showFibLevels) {
        toggleFibBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 pressable bg-accent-blue/10 text-accent-blue border border-accent-blue/25";
      } else {
        toggleFibBtn.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 pressable opacity-50 bg-slate-200/40 dark:bg-slate-800/40 text-slate-500 dark:text-slate-400 border border-transparent";
      }
      if (window.renderStaticChart) window.renderStaticChart();
    }

    toggleEmaBtn.addEventListener('click', () => {
      showEmaCloud = !showEmaCloud;
      updateToggleStyles();
    });
    toggleFibBtn.addEventListener('click', () => {
      showFibLevels = !showFibLevels;
      updateToggleStyles();
    });

    // Fullscreen toggler
    const fsBtn = document.getElementById('fullscreenBtn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Latest button pulse
    document.getElementById('latestCandleBtn').addEventListener('click', () => {
      if (window.renderStaticChart) window.renderStaticChart();
    });
  </script>
<script data-purpose="static-chart-renderer">
    // Rock-solid static rendering of candles, Monday levels, 1.618 Fib lines, EMA Cloud, and Trade position box
    const canvas = document.getElementById('spikeChartCanvas');
    const ctx = canvas.getContext('2d');

    // Deterministic synthetic candle sequence matching screenshot
    const candleData = [
      { t: "2/4",  o: 0.323, h: 0.326, l: 0.320, c: 0.322 },
      { t: "2/5",  o: 0.322, h: 0.328, l: 0.321, c: 0.327 },

      { t: "2/7",  o: 0.324, h: 0.329, l: 0.323, c: 0.328 },

      { t: "2/10", o: 0.321, h: 0.326, l: 0.316, c: 0.325 },

      { t: "2/21", o: 0.323, h: 0.329, l: 0.322, c: 0.327 },
      { t: "2/22", o: 0.327, h: 0.332, l: 0.325, c: 0.330 },

      { t: "3/1",  o: 0.340, h: 0.343, l: 0.334, c: 0.336 },
      { t: "3/2",  o: 0.336, h: 0.339, l: 0.331, c: 0.334 },

      { t: "3/4",  o: 0.337, h: 0.342, l: 0.335, c: 0.341 },
      { t: "3/5",  o: 0.341, h: 0.346, l: 0.340, c: 0.344 },

      { t: "3/10", o: 0.370, h: 0.375, l: 0.368, c: 0.374 },
      { t: "3/11", o: 0.374, h: 0.377, l: 0.370, c: 0.372 },
      { t: "3/12", o: 0.372, h: 0.380, l: 0.371, c: 0.378 },
      { t: "3/13", o: 0.378, h: 0.384, l: 0.377, c: 0.382 },
      { t: "3/14", o: 0.382, h: 0.385, l: 0.367, c: 0.369 },
      { t: "3/15", o: 0.369, h: 0.373, l: 0.366, c: 0.371 },
      { t: "3/16", o: 0.371, h: 0.376, l: 0.369, c: 0.375 },
      { t: "3/17", o: 0.375, h: 0.378, l: 0.372, c: 0.377 },
      { t: "3/18", o: 0.377, h: 0.381, l: 0.376, c: 0.3794 }
    ];

    window.renderStaticChart = function() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";

      ctx.save();
      ctx.scale(dpr, dpr);

      const isDark = document.documentElement.classList.contains('dark');

      // Theme palettes
      const colors = {
        bg: isDark ? '#0b0e14' : '#f8fafc',
        textMuted: isDark ? '#64748b' : '#94a3b8',
        axisLine: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
        greenUp: isDark ? '#10b981' : '#16a34a',
        redDown: isDark ? '#f43f5e' : '#e11d48',
        fibUpper: '#2563eb', // +1.618
        fibLower: '#e11d48', // -1.618
        monHigh: '#16a34a',
        monLow: '#e11d48',
        activePriceBadge: '#0a84ff'
      };

      // Clear Canvas
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, w, h);

      // Layout boundaries
      const priceAxisWidth = w < 640 ? 56 : 76;
      const timeAxisHeight = 36;
      const chartWidth = w - priceAxisWidth;
      const chartHeight = h - timeAxisHeight;

      const minPrice = 0.2980;
      const maxPrice = 0.3920;
      const priceRange = maxPrice - minPrice;

      function getY(price) {
        return chartHeight - ((price - minPrice) / priceRange) * chartHeight;
      }

      // X coordinate distribution
      const totalCandles = candleData.length;
      const slotWidth = chartWidth / (totalCandles + 2);
      const candleBodyWidth = Math.max(3, Math.min(10, slotWidth * 0.62));

      function getX(index) {
        return (index + 1) * slotWidth;
      }

      // 1. Draw EMA Cloud (if active)
      if (typeof showEmaCloud === 'undefined' || showEmaCloud) {
        ctx.beginPath();
        // Bullish cloud zone
        for (let i = 0; i < totalCandles; i++) {
          const x = getX(i);
          const emaFast = candleData[i].c * 0.985 - 0.003;
          const y = getY(emaFast);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        for (let i = totalCandles - 1; i >= 0; i--) {
          const x = getX(i);
          const emaSlow = candleData[i].c * 0.955 - 0.006;
          const y = getY(emaSlow);
          ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = isDark ? 'rgba(16, 185, 129, 0.12)' : 'rgba(16, 185, 129, 0.16)';
        ctx.fill();

        // Previous pullback transition cloud
        ctx.beginPath();
        for (let i = 0; i < 18; i++) {
          const x = getX(i);
          const f = candleData[i].l - 0.003;
          if (i === 0) ctx.moveTo(x, getY(f));
          else ctx.lineTo(x, getY(f));
        }
        for (let i = 17; i >= 0; i--) {
          const x = getX(i);
          const s = candleData[i].l - 0.009;
          ctx.lineTo(x, getY(s));
        }
        ctx.closePath();
        ctx.fillStyle = isDark ? 'rgba(244, 63, 94, 0.10)' : 'rgba(244, 63, 94, 0.14)';
        ctx.fill();
      }

      // 2. Draw Long Position Risk/Reward Box (From Screenshot at 3/9 breakout)
      const tradeStartIndex = 31;
      const tradeX = getX(tradeStartIndex);
      const tradeEndX = getX(totalCandles - 1);
      const entryPrice = 0.3620;
      const stopPrice = 0.3340;
      const tpPrice = 0.3720;
      const extPrice = 0.3820;

      // Green Profit Zone
      ctx.fillStyle = isDark ? 'rgba(16, 185, 129, 0.15)' : 'rgba(16, 185, 129, 0.18)';
      ctx.fillRect(tradeX, getY(extPrice), (tradeEndX - tradeX) + slotWidth, getY(entryPrice) - getY(extPrice));

      // Red Risk Zone
      ctx.fillStyle = isDark ? 'rgba(244, 63, 94, 0.15)' : 'rgba(244, 63, 94, 0.18)';
      ctx.fillRect(tradeX, getY(entryPrice), (tradeEndX - tradeX) + slotWidth, getY(stopPrice) - getY(entryPrice));

      // Position Boundary Borders
      ctx.strokeStyle = isDark ? 'rgba(16, 185, 129, 0.4)' : 'rgba(16, 185, 129, 0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(tradeX, getY(entryPrice), (tradeEndX - tradeX) + slotWidth, -(getY(entryPrice) - getY(extPrice)));

      // TP & Ext Levels annotations
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = '#0a84ff';
      ctx.beginPath();
      ctx.moveTo(tradeX, getY(extPrice));
      ctx.lineTo(tradeEndX + slotWidth, getY(extPrice));
      ctx.stroke();

      ctx.strokeStyle = '#10b981';
      ctx.beginPath();
      ctx.moveTo(tradeX, getY(tpPrice));
      ctx.lineTo(tradeEndX + slotWidth, getY(tpPrice));
      ctx.stroke();
      ctx.setLineDash([]);

      // TP & Ext Text
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillStyle = '#0a84ff';
      ctx.fillText("EXT 5.0R (0.3820) · 极值扩展", tradeX + 4, getY(extPrice) - 4);
      ctx.fillStyle = '#10b981';
      ctx.fillText("TP 3.25R (0.3720) · 突破兑现", tradeX + 4, getY(tpPrice) - 4);

      // Stop Loss text
      ctx.fillStyle = '#f43f5e';
      ctx.fillText("SL -1.0R (0.3340)", tradeX + 4, getY(stopPrice) - 4);

      // 3. Horizontal Benchmark Key Levels (1.618 & Mon High/Low)
      const keyLevels = [
        { price: 0.3888, label: "上沿 1.618 0.3888", color: colors.fibUpper, type: 'fib' },
        { price: 0.3620, label: "周一高 Mon High", color: colors.monHigh, type: 'mon' },
        { price: 0.3340, label: "周一低 Mon Low", color: colors.monLow, type: 'mon' },
        { price: 0.3088, label: "下沿 1.618 0.3088", color: colors.fibLower, type: 'fib' }
      ];

      keyLevels.forEach(lvl => {
        if (lvl.type === 'fib' && typeof showFibLevels !== 'undefined' && !showFibLevels) return;
        const y = getY(lvl.price);
        ctx.strokeStyle = lvl.color;
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartWidth, y);
        ctx.stroke();

        // Level label on right border
        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillStyle = lvl.color;
        ctx.textAlign = 'left';
        ctx.fillText(lvl.label, chartWidth + 6, y - 3);
      });

      // 4. Draw Candlesticks (Static, crisp geometry)
      for (let i = 0; i < totalCandles; i++) {
        const c = candleData[i];
        const x = getX(i);
        const yOpen = getY(c.o);
        const yClose = getY(c.c);
        const yHigh = getY(c.h);
        const yLow = getY(c.l);

        const isUp = c.c >= c.o;
        const candleColor = isUp ? colors.greenUp : colors.redDown;

        // Wick
        ctx.strokeStyle = candleColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Candle Body
        const topY = Math.min(yOpen, yClose);
        const bodyH = Math.max(Math.abs(yClose - yOpen), 1.5);
        ctx.fillStyle = candleColor;
        ctx.fillRect(x - candleBodyWidth / 2, topY, candleBodyWidth, bodyH);

        // Special highlight bar for peak spike (Index 38)
        if (i === 38) {
          ctx.fillStyle = '#0a84ff';
          ctx.fillRect(x - candleBodyWidth / 2, topY, candleBodyWidth, bodyH);
          ctx.strokeStyle = '#0a84ff';
          ctx.stroke();
        }
      }

      // 5. Price Axis (Right)
      ctx.strokeStyle = colors.axisLine;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chartWidth, 0);
      ctx.lineTo(chartWidth, chartHeight);
      ctx.stroke();

      // Axis Ticks
      const tickStep = 0.0100;
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = colors.textMuted;
      ctx.textAlign = 'left';

      for (let p = 0.3000; p <= 0.3900; p += tickStep) {
        const y = getY(p);
        if (y > 20 && y < chartHeight - 10) {
          ctx.fillText(p.toFixed(4), chartWidth + 6, y + 4);

          // Subtle right horizontal tick
          ctx.strokeStyle = colors.axisLine;
          ctx.beginPath();
          ctx.moveTo(chartWidth, y);
          ctx.lineTo(chartWidth + 4, y);
          ctx.stroke();
        }
      }

      // Current Price Highlight Badge
      const latestPrice = 0.3794;
      const latestY = getY(latestPrice);
      ctx.fillStyle = colors.activePriceBadge;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(chartWidth + 2, latestY - 10, priceAxisWidth - 6, 20, 4);
      } else {
        ctx.rect(chartWidth + 2, latestY - 10, priceAxisWidth - 6, 20);
      }
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(latestPrice.toFixed(4), chartWidth + (priceAxisWidth - 4) / 2, latestY + 4);

      // 6. Time Axis (Bottom)
      ctx.strokeStyle = colors.axisLine;
      ctx.beginPath();
      ctx.moveTo(0, chartHeight);
      ctx.lineTo(chartWidth, chartHeight);
      ctx.stroke();

      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = colors.textMuted;
      ctx.textAlign = 'center';

      // Sample timestamps every few candles to avoid clutter
      const step = w < 640 ? 4 : 3;
      for (let i = 0; i < totalCandles; i += step) {
        const x = getX(i);
        ctx.fillText(candleData[i].t, x, chartHeight + 16);
      }

      ctx.restore();
    };

    // Debounced Resize Observer for static clarity
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        window.renderStaticChart();
      }, 60);
    });

    // Initial render
    window.renderStaticChart();
  </script>
