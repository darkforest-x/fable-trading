<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPIKE · 轻透玻璃与双击专注</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            spike: {
              bg: '#f8fafd',
              card: 'rgba(255, 255, 255, 0.16)',
              border: 'rgba(255, 255, 255, 0.45)',
              specular: 'rgba(255, 255, 255, 0.75)',
              cyan: '#0071e3',
              green: '#0ea371',
              red: '#e53e5d',
              darkbg: '#090c10',
              darkcard: 'rgba(18, 24, 38, 0.20)',
              darkborder: 'rgba(255, 255, 255, 0.12)'
            }
          },
          fontFamily: {
            mono: ['"SF Mono"', 'Monaco', 'Menlo', 'Consolas', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"PingFang SC"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* Ultra-clear Apple Glass (iPhone spec: opacity 0.12-0.20, blur 14px, saturation 170%, specular edge) */
    .apple-glass {
      background: rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(14px) saturate(175%);
      backdrop-filter: blur(14px) saturate(175%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), inset 0 1px 1px 0 rgba(255, 255, 255, 0.7);
    }
    .dark .apple-glass {
      background: rgba(15, 20, 30, 0.22);
      -webkit-backdrop-filter: blur(14px) saturate(175%);
      backdrop-filter: blur(14px) saturate(175%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.35), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Fallback if backdrop-filter is not supported */
    @supports not ((-webkit-backdrop-filter: none) or (backdrop-filter: none)) {
      .apple-glass {
        background: rgba(248, 250, 253, 0.90);
      }
      .dark .apple-glass {
        background: rgba(14, 18, 26, 0.92);
      }
    }

    /* Glass Pills for inner controls */
    .apple-pill {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dark .apple-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Active Selected State in Glass */
    .apple-pill-active {
      background: rgba(0, 113, 227, 0.15);
      border: 1px solid rgba(0, 113, 227, 0.4);
      color: #0071e3;
      font-weight: 600;
    }
    .dark .apple-pill-active {
      background: rgba(0, 229, 255, 0.16);
      border: 1px solid rgba(0, 229, 255, 0.45);
      color: #00e5ff;
    }

    /* Focus Mode UI Hiding Transition */
    .floating-ui-layer {
      transition: opacity 0.26s cubic-bezier(0.16, 1, 0.3, 1), transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.26s;
      will-change: opacity, transform;
    }

    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(-8px) scale(0.98);
      visibility: hidden !important;
    }

    .ui-hidden-bottom {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(16px) scale(0.98);
      visibility: hidden !important;
    }

    /* Smooth Candle Glow */
    .candle-shadow-up {
      filter: drop-shadow(0 2px 4px rgba(14, 163, 113, 0.15));
    }
    .candle-shadow-down {
      filter: drop-shadow(0 2px 4px rgba(229, 62, 93, 0.15));
    }

    /* Custom Scrollbar for horizontal chips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full w-full bg-[#f6f8fb] dark:bg-[#080b11] text-slate-800 dark:text-slate-100 font-sans select-none overflow-hidden touch-manipulation">

  <!-- Mobile Viewport Frame (390px portrait simulation container) -->

          <!-- Grid linear pattern -->
          <pattern id="chartGrid" width="65" height="48" patternUnits="userSpaceOnUse">
            <path d="M 65 0 L 0 0 0 48" fill="none" stroke="currentColor" class="text-slate-200/50 dark:text-slate-800/40" stroke-width="0.75" stroke-dasharray="3,3"/>
          </pattern>
          <!-- Price fill gradient -->
          <linearGradient id="volGradUp" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0ea371" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0ea371" stop-opacity="0.05"/>
          </linearGradient>
          <linearGradient id="volGradDown" x1="0" y1="0" x2="0" y2="1">

            <stop offset="100%" stop-color="#e53e5d" stop-opacity="0.05"/>

        </defs>

        <!-- Background grid -->
        <rect width="100%" height="100%" fill="url(#chartGrid)"/>

        <!-- Subtle Watermark Symbol centered in chart -->

        <!-- ================= FIBONACCI & WEEKLY HORIZONTAL REFERENCE LINES ================= -->

        <!-- Entry Trade Baseline (184.50) - Thin Precision Line -->

          <rect x="67" y="730" width="10" height="80" fill="url(#volGradUp)"/>

  <!-- 5. INTERACTION CONTROLLER: DOUBLE TAP FOCUS MODE & THEMES -->
  <!-- ========================================== -->
  <script>
    (function initSpikeFocusApp() {
      const appRoot = document.getElementById('appRoot');
      const chartContainer = document.getElementById('chartContainer');
      const topOverlayGroup = document.getElementById('topOverlayGroup');
      const bottomOverlayGroup = document.getElementById('bottomOverlayGroup');
      const touchContractsSheet = document.getElementById('touchContractsSheet');
      const touchesBtn = document.getElementById('touchesBtn');
      const closeSheetBtn = document.getElementById('closeSheetBtn');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const maToggleBtn = document.getElementById('maToggleBtn');

      // State Memory
      let isFocusMode = false;
      let sheetWasOpenBeforeFocus = true;

      // 1. Toggle Latest Touches Drawer
      touchesBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        touchContractsSheet.classList.toggle('hidden');
      });

      closeSheetBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        touchContractsSheet.classList.add('hidden');
      });

      // 2. Light / Dark Theme Toggle
      themeToggleBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.documentElement.classList.toggle('dark');
      });

      // 3. MA6 Toggle Demo
      maToggleBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        const span = maToggleBtn.querySelector('span:last-child');
        if (span.textContent === 'OFF') {
          span.textContent = 'ON';
          span.className = 'text-[9px] text-[#0071e3] dark:text-[#00e5ff] font-bold';
        } else {
          span.textContent = 'OFF';
          span.className = 'text-[9px] text-slate-400';
        }
      });

      // 4. DOUBLE CLICK / DOUBLE TAP FOCUS MODE TOGGLE
      // (Hides all floating UI layers completely, leaving only clean chart & axes)
      function toggleFocusMode() {
        isFocusMode = !isFocusMode;

        if (isFocusMode) {
          // Record current sheet state
          sheetWasOpenBeforeFocus = !touchContractsSheet.classList.contains('hidden');

          // Hide all floating layers with silky scale & opacity
          topOverlayGroup.classList.add('ui-hidden');
          bottomOverlayGroup.classList.add('ui-hidden-bottom');
          touchContractsSheet.classList.add('ui-hidden');
        } else {
          // Restore prior floating components exactly
          topOverlayGroup.classList.remove('ui-hidden');
          bottomOverlayGroup.classList.remove('ui-hidden-bottom');
          if (sheetWasOpenBeforeFocus) {
            touchContractsSheet.classList.remove('ui-hidden');
          }
        }
      }

      // Desktop Double Click
      chartContainer.addEventListener('dblclick', (e) => {
        toggleFocusMode();
      });

      // Mobile Double Tap detection
      let lastTapTime = 0;
      chartContainer.addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapInterval = currentTime - lastTapTime;
        if (tapInterval < 300 && tapInterval > 0) {
          // Double tap detected!
          e.preventDefault();
          toggleFocusMode();
        }
        lastTapTime = currentTime;
      });

    })();
  </script>
