      const priceBadgeContainer = document.getElementById('priceBadgeContainer');
      const crosshairHUD = document.getElementById('crosshairHUD');
      const hudContent = document.getElementById('hudContent');

      // Static Reference Horizontal Levels
      const LEVELS = {
        fibHigh: 0.3880,   // 上沿 1.618
        mondayHigh: 0.3620, // 周一高
        mondayLow: 0.3340,  // 周一低
        fibLow: 0.3080     // 下沿 1.618
      };

      // Generate Synthetic Candlestick Market Data (120 bars)
      const candles = [];
      const startTime = new Date('2025-02-01T00:00:00Z').getTime();
      const stepTime = 12 * 3600 * 1000; // 12H

      let curPrice = 0.3180;
      for (let i = 0; i < 96; i++) {
        const time = startTime + i * stepTime;
        const isMonday = new Date(time).getUTCDay() === 1;

        // Controlled random walk with upward trend breakout in W43
        let drift = (i > 65) ? 0.0011 : (i > 30 ? 0.0004 : -0.0002);
        const noise = (Math.random() - 0.48) * 0.0055;
        const open = curPrice;
        let close = open + drift + noise;
        let high = Math.max(open, close) + Math.random() * 0.0040;
        let low = Math.min(open, close) - Math.random() * 0.0040;

        // Ensure Monday special setup & recent breakout
        if (i === 72) {
          // Monday reference candle
          close = 0.3590;
          high = LEVELS.mondayHigh;
          low = LEVELS.mondayLow;
        } else if (i === 88) {
          // 1.618 confirmation bar
          close = 0.3685;
          high = 0.3710;
        }

        curPrice = close;

        // Compute pseudo EMA 20 & EMA 50
        const ema20 = (curPrice * 0.65) + (LEVELS.mondayLow * 0.35) + Math.sin(i * 0.12) * 0.006;
        const ema50 = (curPrice * 0.40) + (LEVELS.mondayLow * 0.60) + Math.cos(i * 0.10) * 0.004;

        candles.push({
          index: i,
          time,
          isMonday,
          open,
          high,
          low,
          close,
          ema20,
          ema50,
          isConfirmation: (i >= 86 && i <= 88)
        });
      }

      // Latest Candle Update
      const latest = candles[candles.length - 1];
      document.getElementById('liveTickerPrice').innerText = latest.close.toFixed(4);

      // Sizing & DPI Handler
      let width = 0;
      let height = 0;
      const priceAxisWidth = 84;
      const timeAxisHeight = 28;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        draw();
      }

      window.addEventListener('resize', resize);

      // Coordinate Transform Helpers
      function getPriceRange() {
        let min = 0.2980;
        let max = 0.3980;
        return { min, max, span: max - min };
      }

      function priceToY(price, range) {
        const chartAreaH = height - timeAxisHeight;
        const norm = (price - range.min) / range.span;
        return chartAreaH - (norm * (chartAreaH - 40)) - 20;
      }

      function yToPrice(y, range) {
        const chartAreaH = height - timeAxisHeight;
        const norm = (chartAreaH - 20 - y) / (chartAreaH - 40);
        return range.min + norm * range.span;
      }

      // Rendering Routine
      function draw() {
        if (!width || !height) return;

        const isDark = document.documentElement.classList.contains('dark');
        state.isDark = isDark;

        // 1. Background Fill
        ctx.fillStyle = isDark ? '#070B12' : '#F8FAFC';
        ctx.fillRect(0, 0, width, height);

        const range = getPriceRange();
        const chartW = width - priceAxisWidth;
        const chartH = height - timeAxisHeight;

        // 2. Subtle Grid Lines
        ctx.lineWidth = 1;
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.04)' : 'rgba(15, 23, 42, 0.04)';

        // Horizontal price grids (every 0.0100 step)
        for (let p = 0.3000; p <= 0.4000; p += 0.0100) {
          const y = Math.round(priceToY(p, range)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(chartW, y);
          ctx.stroke();
        }

        // 3. Horizontal Reference Lines (周一高、周一低、上沿 1.618、下沿 1.618)
        if (state.showFibLevels) {
          drawReferenceLine(LEVELS.fibHigh, '上沿 1.618', '#0071E3', 'rgba(0, 113, 227, 0.12)', range, chartW, isDark);
          drawReferenceLine(LEVELS.mondayHigh, '周一高 Mon High', '#30D158', 'rgba(48, 209, 88, 0.14)', range, chartW, isDark);
          drawReferenceLine(LEVELS.mondayLow, '周一低 Mon Low', '#FF453A', 'rgba(255, 69, 58, 0.14)', range, chartW, isDark);
          drawReferenceLine(LEVELS.fibLow, '下沿 1.618', '#E11D48', 'rgba(225, 29, 72, 0.12)', range, chartW, isDark);
        }

        // Layout calculations for Bars
        const barSpacing = Math.max(7, (chartW / candles.length) * state.zoom);
        const candleBodyW = Math.max(3, barSpacing * 0.68);
        const visibleBars = Math.floor(chartW / barSpacing);
        const startIdx = Math.max(0, candles.length - visibleBars + Math.round(state.panOffsetX / barSpacing));

        // 4. Vibrant Translucent EMA 20/50 Cloud (In 'Signal' mode)
        if (state.activeMode === 'signal' && state.showEmaCloud && candles.length > 2) {
          drawEmaCloud(range, barSpacing, startIdx, chartW);
        }

        // 5. Trade Reference Overlay (1R / 3.75R / 5R Risk / Reward Reference Frame)
        if (state.activeMode === 'signal') {
          drawTradeOverlay(range, barSpacing, startIdx, isDark);
        }

        // 6. Draw Candlesticks (Razor Sharp)
        for (let i = 0; i < candles.length; i++) {
          const c = candles[i];
          const x = (i - startIdx) * barSpacing + (barSpacing / 2);
          if (x < -20 || x > chartW + 20) continue;

          const openY = priceToY(c.open, range);
          const closeY = priceToY(c.close, range);
          const highY = priceToY(c.high, range);
          const lowY = priceToY(c.low, range);

          const isBull = c.close >= c.open;

          // Color Palette Mapping
          let barColor = isBull ? '#30D158' : '#FF453A';
          if (c.isConfirmation) {
            barColor = '#0A84FF'; // Confirmation Blue
          } else if (c.isMonday) {
            barColor = '#30D158'; // Monday Green
          } else if (!isBull && Math.abs(c.close - c.open) < 0.001) {
            barColor = '#94A3B8'; // Neutral Slate Grey
          }

          // Wick
          ctx.strokeStyle = barColor;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, Math.round(highY));
          ctx.lineTo(Math.round(x) + 0.5, Math.round(lowY));
          ctx.stroke();

          // Body
          ctx.fillStyle = barColor;
          const bodyY = Math.min(openY, closeY);
          const bodyH = Math.max(1.8, Math.abs(openY - closeY));
          ctx.fillRect(
            Math.round(x - candleBodyW / 2),
            Math.round(bodyY),
            Math.round(candleBodyW),
            Math.round(bodyH)
          );
        }

        // 7. Right Price Axis & Labels
        drawPriceAxis(range, chartW, chartH, isDark);

        // 8. Bottom Time Axis & Timestamps
        drawTimeAxis(barSpacing, startIdx, chartW, chartH, isDark);

        // 9. Interactive Crosshair (if inside chart)
        if (state.cursorX >= 0 && state.cursorX <= chartW && state.cursorY >= 0 && state.cursorY <= chartH) {
          drawCrosshair(state.cursorX, state.cursorY, chartW, chartH, range, isDark);
        }
      }

      // Draw EMA 20/50 Cloud
      function drawEmaCloud(range, barSpacing, startIdx, chartW) {
        // Collect coordinates
        const points = [];
        for (let i = 0; i < candles.length; i++) {
          const x = (i - startIdx) * barSpacing + (barSpacing / 2);
          const y20 = priceToY(candles[i].ema20, range);
          const y50 = priceToY(candles[i].ema50, range);
          points.push({ x, y20, y50, isBullish: candles[i].ema20 >= candles[i].ema50 });
        }

        // Render polygon ribbons
        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];

          if (p2.x < 0 || p1.x > chartW) continue;

          const isBull = p1.isBullish;
          // Spec: Emerald green #10B981 ~0.20 opacity; Coral red #F43F5E ~0.18 opacity
          ctx.fillStyle = isBull ? 'rgba(16, 185, 129, 0.20)' : 'rgba(244, 63, 94, 0.18)';

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y20);
          ctx.lineTo(p2.x, p2.y20);
          ctx.lineTo(p2.x, p2.y50);
          ctx.lineTo(p1.x, p1.y50);
          ctx.closePath();
          ctx.fill();
        }
      }

      // Draw Trade Overlay (Discrete Risk/Profit Frame with 1R, 3.75R, 5R Ticks)
      function drawTradeOverlay(range, barSpacing, startIdx, isDark) {
        const entryIdx = 76;
        const exitIdx = 94;

        const xStart = (entryIdx - startIdx) * barSpacing + (barSpacing / 2);
        const xEnd = (exitIdx - startIdx) * barSpacing + (barSpacing / 2);

        if (xEnd < 0) return;

        const entryP = 0.3420;
        const slP = 0.3340;     // -1R (Risk)
        const tp1P = 0.3500;    // +1R
        const tp2P = 0.3720;    // +3.75R
        const tp3P = 0.3820;    // +5R

        const yEntry = priceToY(entryP, range);
        const ySl = priceToY(slP, range);
        const yTp1 = priceToY(tp1P, range);
        const yTp2 = priceToY(tp2P, range);
        const yTp3 = priceToY(tp3P, range);

        const w = xEnd - xStart;

        // 1. Risk Area (-1R Red Box)
        ctx.fillStyle = 'rgba(244, 63, 94, 0.10)';
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(xStart, yEntry, w, ySl - yEntry);
        ctx.fill();
        ctx.stroke();

        // 2. Profit Area (+3.75R Green Frame)
        ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.60)';
        ctx.beginPath();
        ctx.rect(xStart, yTp2, w, yEntry - yTp2);
        ctx.fill();
        ctx.stroke();

        // Target Horizontal Lines & 9px Ticks
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#10B981';
        ctx.beginPath();
        ctx.moveTo(xStart, yTp2);
        ctx.lineTo(xEnd, yTp2);
        ctx.stroke();

        ctx.strokeStyle = '#38BDF8';
        ctx.beginPath();
        ctx.moveTo(xStart, yTp3);
        ctx.lineTo(xEnd, yTp3);
        ctx.stroke();
        ctx.setLineDash([]);

        // Overlay Text Ticks (9px JetBrains Mono)
        ctx.font = '600 9px "JetBrains Mono", monospace';
        ctx.fillStyle = isDark ? '#F43F5E' : '#E11D48';
        ctx.fillText('SL -1.0R (0.3340)', xStart + 8, ySl - 4);

        ctx.fillStyle = isDark ? '#34D399' : '#087F69';
        ctx.fillText('TP 3.75R (0.3720) · 突破兑现', xStart + 8, yTp2 + 11);

        ctx.fillStyle = isDark ? '#38BDF8' : '#0071E3';
        ctx.fillText('EXT 5.0R (0.3820) · 极值扩展', xStart + 8, yTp3 - 4);
      }

      // Draw Reference Levels
      function drawReferenceLine(price, label, strokeColor, fillColor, range, chartW, isDark) {
        const y = Math.round(priceToY(price, range)) + 0.5;

        // Line across canvas
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartW, y);
        ctx.stroke();

        // Pill Badge on right
        ctx.font = '600 10px "Inter", sans-serif';
        const txt = `${label} ${price.toFixed(4)}`;
        const tw = ctx.measureText(txt).width;

        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.roundRect(chartW + 4, y - 8, tw + 10, 16, 4);
        ctx.fill();

        ctx.fillStyle = strokeColor;
        ctx.fillText(txt, chartW + 9, y + 3.5);
      }

      // Price Axis Rendering
      function drawPriceAxis(range, chartW, chartH, isDark) {
        // Vertical Separator hairline
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(15, 23, 42, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(chartW + 0.5, 0);
        ctx.lineTo(chartW + 0.5, chartH);
        ctx.stroke();

        ctx.font = '500 11px "JetBrains Mono", monospace';
        ctx.fillStyle = isDark ? '#94A3B8' : '#64748B';

        for (let p = 0.3000; p <= 0.4000; p += 0.0100) {
          const y = priceToY(p, range);
          ctx.fillText(p.toFixed(4), chartW + 10, y + 4);
        }

        // Current Price Highlight Badge
        const lastP = latest.close;
        const lastY = priceToY(lastP, range);
        ctx.fillStyle = '#0071E3';
        ctx.beginPath();
        ctx.roundRect(chartW + 2, lastY - 9, priceAxisWidth - 6, 18, 5);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 11px "JetBrains Mono", monospace';
        ctx.fillText(lastP.toFixed(4), chartW + 10, lastY + 3.5);
      }

      // Time Axis Rendering
      function drawTimeAxis(barSpacing, startIdx, chartW, chartH, isDark) {
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(15, 23, 42, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, chartH + 0.5);
        ctx.lineTo(chartW, chartH + 0.5);
        ctx.stroke();

        ctx.font = '500 10px "JetBrains Mono", monospace';
        ctx.fillStyle = isDark ? '#64748B' : '#94A3B8';

        const step = Math.max(1, Math.floor(80 / barSpacing));
        for (let i = 0; i < candles.length; i += step) {
          const x = (i - startIdx) * barSpacing + (barSpacing / 2);
          if (x < 10 || x > chartW - 30) continue;

          const d = new Date(candles[i].time);
          const dateStr = `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
          ctx.fillText(dateStr, x - 12, height - 8);
        }
      }

      // Crosshair Readout
      function drawCrosshair(cx, cy, chartW, chartH, range, isDark) {
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.35)' : 'rgba(15, 23, 42, 0.35)';
        ctx.lineWidth = 1;

        // Horiz
        ctx.beginPath();
        ctx.moveTo(0, Math.round(cy) + 0.5);
        ctx.lineTo(chartW, Math.round(cy) + 0.5);
        ctx.stroke();

        // Vert
        ctx.beginPath();
        ctx.moveTo(Math.round(cx) + 0.5, 0);
        ctx.lineTo(Math.round(cx) + 0.5, chartH);
        ctx.stroke();
        ctx.restore();

        // Axis Pill on Right for cursor Y
        const curPrice = yToPrice(cy, range);
        ctx.fillStyle = isDark ? '#1E293B' : '#0F172A';
        ctx.beginPath();
        ctx.roundRect(chartW + 2, cy - 8, priceAxisWidth - 6, 16, 4);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.fillText(curPrice.toFixed(4), chartW + 10, cy + 3.5);
      }

      // Interactive Events (Crosshair, Pan, Pinch Zoom)
      let isDragging = false;
      let lastMouseX = 0;

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        state.cursorX = e.clientX - rect.left;
        state.cursorY = e.clientY - rect.top;

        if (isDragging) {
          const dx = e.clientX - lastMouseX;
          state.panOffsetX += dx;
          lastMouseX = e.clientX;
        }

        // HUD Tooltip Positioning
        const range = getPriceRange();
        const pAtCursor = yToPrice(state.cursorY, range);
        crosshairHUD.classList.remove('hidden');
        crosshairHUD.style.left = `${Math.min(window.innerWidth - 180, Math.max(10, state.cursorX + 16))}px`;
        crosshairHUD.style.top = `${Math.min(window.innerHeight - 60, Math.max(70, state.cursorY - 24))}px`;
        hudContent.innerText = `P: ${pAtCursor.toFixed(4)} | 1.618 扩展带`;

        draw();
      });

      canvas.addEventListener('mouseleave', () => {
        state.cursorX = -1;
        state.cursorY = -1;
        crosshairHUD.classList.add('hidden');
        draw();
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY * -0.0015;
        state.zoom = Math.min(2.5, Math.max(0.6, state.zoom + zoomDelta));
        draw();
      }, { passive: false });

      // Touch handlers for mobile
      let touchStartX = 0;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          state.cursorX = e.touches[0].clientX;
          state.cursorY = e.touches[0].clientY;
          draw();
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const currentX = e.touches[0].clientX;
          const dx = currentX - touchStartX;
          state.panOffsetX += dx * 0.85;
          touchStartX = currentX;
          state.cursorX = e.touches[0].clientX;
          state.cursorY = e.touches[0].clientY;
          draw();
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        state.cursorX = -1;
        state.cursorY = -1;
        draw();
      });

      // UI Controls Binding
      // 1. Theme Switcher
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        draw();
      });

      // 2. Mode Switcher (区间 vs 信号)
      const modeRangeBtn = document.getElementById('modeRangeBtn');
      const modeSignalBtn = document.getElementById('modeSignalBtn');

      modeRangeBtn.addEventListener('click', () => {
        state.activeMode = 'range';
        modeRangeBtn.className = "px-2.5 sm:px-3 py-1 rounded-full text-body-sm font-semibold transition bg-white dark:bg-slate-800 text-on-surface dark:text-white shadow-sm";
        modeSignalBtn.className = "px-2.5 sm:px-3 py-1 rounded-full text-body-sm font-semibold transition text-on-surface-variant dark:text-slate-400 hover:text-on-surface flex items-center gap-1.5";
        draw();
      });

      modeSignalBtn.addEventListener('click', () => {
        state.activeMode = 'signal';
        modeSignalBtn.className = "px-2.5 sm:px-3 py-1 rounded-full text-body-sm font-semibold transition bg-white dark:bg-slate-800 text-on-surface dark:text-white shadow-sm flex items-center gap-1.5";
        modeRangeBtn.className = "px-2.5 sm:px-3 py-1 rounded-full text-body-sm font-semibold transition text-on-surface-variant dark:text-slate-400 hover:text-on-surface";
        draw();
      });

      // 3. Timeframe selector
      const tfButtons = document.querySelectorAll('.tf-btn');
      tfButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          tfButtons.forEach(b => {
            b.className = "tf-btn px-2 py-1 rounded-full font-label-numeric-sm text-body-sm text-on-surface-variant dark:text-slate-400 hover:bg-white/40 dark:hover:bg-white/10";
          });
          btn.className = "tf-btn active px-2.5 py-1 rounded-full font-label-numeric-sm text-body-sm font-bold bg-white dark:bg-slate-800 text-primary-container dark:text-sky-400 shadow-sm";
          state.timeframe = btn.getAttribute('data-tf');
          draw();
        });
      });

      // 4. Indicator toggles
      const toggleEmaCloud = document.getElementById('toggleEmaCloud');
      toggleEmaCloud.addEventListener('click', () => {
        state.showEmaCloud = !state.showEmaCloud;
        if (state.showEmaCloud) {
          toggleEmaCloud.classList.add('bg-secondary-container/30', 'text-secondary', 'dark:bg-secondary/20', 'dark:text-emerald-300');
          toggleEmaCloud.classList.remove('opacity-40');
        } else {
          toggleEmaCloud.classList.remove('bg-secondary-container/30', 'text-secondary', 'dark:bg-secondary/20', 'dark:text-emerald-300');
          toggleEmaCloud.classList.add('opacity-40');
        }
        draw();
      });

      const toggleFibLevels = document.getElementById('toggleFibLevels');
      toggleFibLevels.addEventListener('click', () => {
        state.showFibLevels = !state.showFibLevels;
        if (state.showFibLevels) {
          toggleFibLevels.classList.add('bg-primary-fixed/40', 'text-primary-container', 'dark:bg-sky-950/40', 'dark:text-sky-300');
          toggleFibLevels.classList.remove('opacity-40');
        } else {
          toggleFibLevels.classList.remove('bg-primary-fixed/40', 'text-primary-container', 'dark:bg-sky-950/40', 'dark:text-sky-300');
          toggleFibLevels.classList.add('opacity-40');
        }
        draw();
      });

      // 5. Follow latest candle button
      const resetPanBtn = document.getElementById('resetPanBtn');
      resetPanBtn.addEventListener('click', () => {
        state.panOffsetX = 0;
        state.zoom = 1.0;
        draw();
      });

      // 6. Popovers (Stats & Settings)
      const statsCapsuleBtn = document.getElementById('statsCapsuleBtn');
      const statsPopover = document.getElementById('statsPopover');
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsPopover = document.getElementById('settingsPopover');

      statsCapsuleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isShown = statsPopover.classList.contains('popover-visible');
        if (isShown) {
          statsPopover.classList.remove('popover-visible');
          statsPopover.classList.add('popover-hidden');
        } else {
          settingsPopover.classList.remove('popover-visible');
          settingsPopover.classList.add('popover-hidden');
          statsPopover.classList.remove('popover-hidden');
          statsPopover.classList.add('popover-visible');
        }
      });

      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isShown = settingsPopover.classList.contains('popover-visible');
        if (isShown) {
          settingsPopover.classList.remove('popover-visible');
          settingsPopover.classList.add('popover-hidden');
        } else {
          statsPopover.classList.remove('popover-visible');
          statsPopover.classList.add('popover-hidden');
          settingsPopover.classList.remove('popover-hidden');
          settingsPopover.classList.add('popover-visible');
        }
      });

      window.addEventListener('click', () => {
        statsPopover.classList.remove('popover-visible');
        statsPopover.classList.add('popover-hidden');
        settingsPopover.classList.remove('popover-visible');
        settingsPopover.classList.add('popover-hidden');
      });

      [statsPopover, settingsPopover].forEach(p => {
        p.addEventListener('click', e => e.stopPropagation());
      });

      // Initial Launch
      resize();
    })();
  </script>
</body></html>
