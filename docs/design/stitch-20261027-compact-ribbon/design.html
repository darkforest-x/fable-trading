<!-- Vanilla JS: Dark Mode Toggle, Non-intrusive Account Selection & Drag-and-Drop Reorder -->
<script>
    // 1. Dark Mode toggle
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // 2. Popover toggle / dismiss
    const popoverScrim = document.getElementById('popover-scrim');
    const closeBtn = document.getElementById('close-popover-btn');
    const triggerBtn = document.getElementById('account-trigger-btn');

    function togglePopover() {
      popoverScrim.classList.toggle('hidden');
    }
    closeBtn.addEventListener('click', () => popoverScrim.classList.add('hidden'));
    triggerBtn.addEventListener('click', () => popoverScrim.classList.toggle('hidden'));

    // Close on clicking outside container
    popoverScrim.addEventListener('click', (e) => {
      if (e.target === popoverScrim) {
        popoverScrim.classList.add('hidden');
      }
    });

    // 3. Selection vs Strategy Book Independent Behavior
    const accountRows = document.querySelectorAll('.account-row');
    accountRows.forEach(row => {
      // Row click: Select Account
      row.addEventListener('click', (e) => {
        // If clicking book button or drag handle, do NOT switch selection
        if (e.target.closest('.book-action') || e.target.closest('.drag-handle')) {
          return;
        }
        accountRows.forEach(r => r.classList.remove('row-selected'));
        row.classList.add('row-selected');

        // Update header trigger label
        const accountId = row.getAttribute('data-account-id');
        const triggerLabel = document.querySelector('#account-trigger-btn span.font-mono');
        if (triggerLabel) triggerLabel.textContent = accountId;
      });
    });

    // 4. Book buttons: Independent action (Does not alter selected account)
    const bookButtons = document.querySelectorAll('.book-action');
    bookButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const row = btn.closest('.account-row');
        const accountId = row.getAttribute('data-account-id');
        // Gentle haptic feedback / visual pulse
        btn.classList.add('ring-2', 'ring-apple-blue');
        setTimeout(() => btn.classList.remove('ring-2', 'ring-apple-blue'), 400);
        console.log(`[Strategy Booklet] 呼出 ${accountId} 白皮书抽屉 (不切换当前选中账户)`);
      });
    });

    // 5. Native Touch & Pointer Drag-and-Drop Reorder with Smooth Neighbor Movement
    const list = document.getElementById('accounts-drag-list');
    let draggedItem = null;
    let placeholder = null;

    list.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.drag-handle');
      if (!handle) return;

      const item = handle.closest('.account-row');
      draggedItem = item;
      item.classList.add('dragging-row');

      // Add temporary document listeners for smooth move & drop
      function onPointerMove(moveEvent) {
        if (!draggedItem) return;
        const targetElement = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
        if (!targetElement) return;

        const overRow = targetElement.closest('.account-row');
        if (overRow && overRow !== draggedItem) {
          const bounding = overRow.getBoundingClientRect();
          const offset = moveEvent.clientY - bounding.top;
          if (offset > bounding.height / 2) {
            overRow.after(draggedItem);
          } else {
            overRow.before(draggedItem);
          }
        }
      }

      function onPointerUp() {
        if (draggedItem) {
          draggedItem.classList.remove('dragging-row');
          draggedItem = null;
          // Persist reorder state log
          const newOrder = Array.from(list.querySelectorAll('.account-row')).map(r => r.getAttribute('data-account-id'));
          console.log('[Order Persisted] 当前账户自定义排序:', newOrder);
        }
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
      }

      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    });
  </script>
