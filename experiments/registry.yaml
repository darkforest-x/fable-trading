# Experiment registry -- every experiment that any current decision rests on.
#
# Registered from the four repositories being consolidated, at the frozen source
# commits in reports/consolidation/source_repo_snapshots.json. Each row answers
# the six questions the task book requires: what was tested, which variable
# moved, on what data, whether holdout was consumed, what happened, and whether
# the result may be reused.
#
# A negative result is a result. `rejected` and `inconclusive` are terminal and
# citable; neither may be quietly rewritten as "pending optimisation".
#
# Validated by yoyo.contracts.artifacts.ExperimentRecord and cross-checked
# against artifacts/registry.yaml by yoyo.artifacts.load_registries.
schema_version: 1

experiments:
  # ==========================================================================
  # yoyo-eth -- numeric semantic baseline, no YOLO
  # ==========================================================================
  - experiment_id: exp-yoyo-eth-semantic-mvp
    source_repo: darkforest-x/yoyo-eth
    source_commit: "6147810afb46be1c664128e9a5359e8e7d0a3923"
    status: rejected
    question: >-
      Without YOLO, using only OHLCV, SMA/EMA 20/60/120, ATR and 27 causal
      semantic features, can a LightGBM regressor rank MA-compression candidates
      so that the top of the ranking more often precedes a profitable SHORT?
    single_variable: ranking model vs single-feature dispersion baseline
    result: >-
      underperformed_matched_random_control. Validation spearman +0.167 (p=0.28)
      did not survive into test, where it reversed to -0.068 (p=0.68). The
      decisive line is the matched control (same symbol, same month, same ATR
      tercile, same horizon, same cost): control +19.9bp gross on validation
      against -14.6bp for the whole candidate pool, i.e. the compression pool was
      34.5bp WORSE than random short entries; on test, -2.0bp against -39.1bp,
      worse by 37.1bp. The val top-decile +62.6bp sits on 5 samples during a
      falling-ETH window and is short beta, not model skill. On test the naive
      "tighter is better" dispersion baseline (+0.349, p=0.027) outranked the
      27-feature model.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_eth/MVP_REPORT.md
    artifacts:
      - yoyo-eth-mvp-report
    reuse_allowed: true
    notes: >-
      Sample size is the first-order limitation and the report says so: 44
      validation and 40 test events, 4-5 samples per decile group. The pool-level
      finding (compression events are worse than random short entries in these
      windows) is the part that carries; the model-level numbers have no
      statistical power. No permutation test was run at MVP stage.

  - experiment_id: exp-yoyo-eth-p02-walkforward-grid
    source_repo: darkforest-x/yoyo-eth
    source_commit: "6147810afb46be1c664128e9a5359e8e7d0a3923"
    status: inconclusive
    question: >-
      Does a walk-forward trigger x quantile grid find a configuration where the
      MA-compression pool beats its matched random control?
    single_variable: trigger definition x score quantile
    result: >-
      No configuration separated the pool from its control; pool-minus-control
      stayed inside -3.9bp..+4.8bp after the control function was corrected.
      Model metrics were bit-identical before and after that correction.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_eth/P02_WALKFORWARD_REPORT.md
    reuse_allowed: true

  - experiment_id: exp-yoyo-eth-p03-anchored-walkforward
    source_repo: darkforest-x/yoyo-eth
    source_commit: "6147810afb46be1c664128e9a5359e8e7d0a3923"
    status: rejected
    question: >-
      Was iteration_v1's anchored val rho=+0.465 (p=0.01, n=31) a real signal or
      a single-split regime coincidence?
    single_variable: decision anchor (legacy zone_start vs anchored causal trigger)
    result: >-
      not_reproducible. Under a 4-fold anchored walk-forward the same events give
      rho +0.219 on the corresponding fold and -0.151 on the next; weighted mean
      rho +0.065 over OOS n=140, inside a +-0.17 noise band. The original +0.465
      was that split serving as both early-stopping selector and a single
      favourable regime. Secondary observation, recorded but not promoted to a
      conclusion: the anchored arm beat legacy in all 4 folds (paired sign test
      p~=0.06), so semantic anchoring helps direction-wise but not enough to
      matter. Pool level unchanged: anchored all-minus-control -5.4bp, legacy
      +4.8bp -- both indistinguishable from same-month same-volatility-bucket
      random entry.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_eth/P03_ANCHORED_WF_REPORT.md
    artifacts:
      - yoyo-eth-p03-anchored-walkforward-report
    reuse_allowed: true
    notes: >-
      The owner-facing options at the end of this report were A stop, B swap the
      6h fixed horizon for a first-hit ATR barrier, C adjudicate the gallery
      first. No option was taken before the repository was frozen for
      consolidation; the label/exit definition is the named next single variable
      if this line is ever resumed.

  - experiment_id: exp-yoyo-eth-p04-strict-platform-v2
    source_repo: darkforest-x/yoyo-eth
    source_commit: "6147810afb46be1c664128e9a5359e8e7d0a3923"
    status: active
    question: >-
      Does a strict platform definition v2, adjudicated by the owner rather than
      by a threshold, isolate a subset of compression events that the loose pool
      dilutes?
    single_variable: platform definition (loose scanner vs strict v2)
    result: >-
      definition_and_review_gallery_only. P04 produced the definition and a
      decision_view/outcome_view review gallery; no model was trained and no
      economic claim was made or tested. Carried forward as an open question,
      not as evidence.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_eth/README.md
    reuse_allowed: true

