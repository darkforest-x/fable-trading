    single_variable: platform definition (loose scanner vs strict v2)
    result: >-
      definition_and_review_gallery_only. P04 produced the definition and a
      decision_view/outcome_view review gallery; no model was trained and no
      economic claim was made or tested. Carried forward as an open question,
      not as evidence.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_eth/README.md
    reuse_allowed: true

