    reuse_allowed: true
    notes: >-
      只推理不训练：用 2026-08-13 从 3060 取回的冻结权重
      （sha256 18bcb5988e6dd36bdf2fc8a1a22d3ad66ab78b777a1d02c88080c937e98d0541，
