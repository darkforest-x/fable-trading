  - experiment_id: exp-yoyo-trading-fixed-w10-classifier-holdout3d
    source_repo: darkforest-x/yoyo-trading
    source_commit: "784766de45a3b876c986d3ba672779124b46a66f"
    status: inconclusive
    question: >-
      On three freshly pulled days, what does the fixed W10 classifier protocol
      return after costs?
    single_variable: n/a -- first holdout trial of this configuration
    result: >-
      126 signals after dedup, 119 closed, maker net +0.0453, taker net -0.0023,
      win rate 31.9%. Three days is a trial, not an acceptance: the sign flips
      with the fee route, and n=119 over one 3-day window carries no walk-forward
      or matched control. Not promoted, not deployed.
    holdout_consumed: true
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yoyo_trading/README.md
    reuse_allowed: false
    notes: >-
      HOLDOUT LEDGER ENTRY. This is consumption number 1 for the fixed W10
      Core4/Confirm1 configuration, on data the owner named directly
      (UTC 2026-08-10 00:00 to 2026-08-13 12:00, 26 USDT-SWAP symbols). It was
      consumed in yoyo-trading before this consolidation began, is recorded here
      so the count survives the merge, and is NOT re-read by anything in this
      task. reuse_allowed is false: the window is burned for this configuration.


