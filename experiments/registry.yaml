      commit wins when it disagrees with the description.

  # ==========================================================================
  # yolo-xx -- pattern teacher, pattern quality, formation
  # ==========================================================================
  - experiment_id: exp-yolo-xx-formation-gpt-variant
    source_repo: darkforest-x/yolo-xx
    source_commit: "9296cfa8e5053d86cea44e29dbd45874c3dff689"
    status: accepted
    question: >-
      How early can formation be called, and what does moving the evaluation
      point cost in discrimination?
    single_variable: evaluation offset (T0-T30 = 8 bars before completion, vs 30 bars early)
    result: >-
      Best formation number to date: AUC 0.7417, 95% CI [0.6888, 0.7882], kappa
      0.295 at T0-T30. The 30-bars-early (7.5h) variant scores AUC 0.6453,
      95% CI [0.5846, 0.7032], kappa 0.206, and pattern-quality A-grade
      classification scores AUC 0.6323, 95% CI [0.5661, 0.6945], kappa 0.159.
      Strict contamination rate of the formation negatives is 4.0%,
      95% CI [1.1%, 13.5%]. Frozen at tag phase3-formation-v1-frozen-20260806.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yolo_xx/README.md
    reuse_allowed: true
    notes: >-
      "accepted" here means the measurement stands, not that the model may
      trade. The confidence intervals on every arm overlap the next arm's, and
      kappa 0.295 is fair agreement at best.

  - experiment_id: exp-yolo-xx-teacher-tip-vs-full-context
    source_repo: darkforest-x/yolo-xx
    source_commit: "9296cfa8e5053d86cea44e29dbd45874c3dff689"
    status: rejected
    question: >-
      Does the old YOLO detector reproduce its full-context performance when it
      is only allowed to see up to the current closed bar (the Tip protocol)?
    single_variable: evaluation window right edge (full context vs tip)
    result: >-
      collapses_at_the_tip. Old-detector reproduction rate is about 9-10% at the
      tip against 62-72% with full context. Recognising a completed pattern and
      recognising one at the live edge are different tasks, and a bbox's right
      edge cannot stand in for a causal onset. This is why YOLO is retained as a
      Pattern Teacher and explicitly not as the final tip trigger.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yolo_xx/README.md
    reuse_allowed: true

  - experiment_id: exp-yolo-xx-quality-ranker-v1
    source_repo: darkforest-x/yolo-xx
    source_commit: "9296cfa8e5053d86cea44e29dbd45874c3dff689"
    status: rejected
    question: >-
      Can a direction-neutral geometry ranker score pattern quality, and is the
      lift from adding further features real?
    single_variable: feature set (direction-neutral geometry vs extended)
    result: >-
      leakage. Direction-neutral geometry scores 0.53/0.55, and the apparent
      lift to 0.64 was leakage rather than signal. Recorded together with the
      prior finding that events carried no direction at all while 46% of the
      boxes were long -- a label-semantics fault, not a modelling one.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: experiments/historical/yolo_xx/README.md
    reuse_allowed: true

  - experiment_id: exp-yolo-xx-pooled-auc-source-discrimination
    source_repo: darkforest-x/yolo-xx
    source_commit: "9296cfa8e5053d86cea44e29dbd45874c3dff689"
    status: rejected
    question: >-
      Was the pooled AUC 0.8067 over 659 samples a breakthrough in pattern
      quality discrimination?
    single_variable: pooling vs per-source stratification
    result: >-
      source_discrimination. Stratified by source, each subset retains only
      0.57-0.65, and the three sources have positive-class rates of 85% / 84% /
      29%. The model was separating collection batches, not patterns. The render
      pipeline had already been unified, so this is the v15 "two render
      pipelines" fault with the trigger surface moved from rendering to
      batching, and grouped CV does not defend against it -- grouped CV stops
      one entity crossing folds, which is a different disease from different
      sources having different base rates.
    holdout_consumed: false
    training_eligible: false
    production_eligible: false
    canonical_report: docs/learnings/pooled-auc-can-be-source-discrimination.md
    reuse_allowed: true

