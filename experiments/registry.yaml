    single_variable: n/a -- dataset construction
    result: >-
      frozen_but_not_training_eligible. SIGNAL 1,247 and NO_SIGNAL 1,402 frozen
      into 2,649 training images (train 1,849 / val 350 / test 450), manifest
      SHA 20686feba41d15b82e34109402840c2d640fe1e2daea0392b35e1ea79320a7fc.
      training_eligible stays false for a specific reason: protocol 17.6
      requires a DIRECT spot-check error rate and the migration produced
